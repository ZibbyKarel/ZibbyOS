<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZibbyOS — logo a splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<style>
.bp{width:1440px;max-width:calc(100% - 40px);margin:24px auto 72px}
.bp h2.h{font-size:26px;font-weight:500;letter-spacing:-.03em;margin:8px 0 6px}
.bp p.lead{color:var(--ink2);font-size:14px;max-width:760px;margin:0 0 22px}
.dir{border:1px solid var(--line2);border-radius:16px;overflow:hidden;margin-bottom:28px;background:var(--p1)}
.dirh{display:flex;align-items:baseline;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dirh b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.dirh span{color:var(--ink2);font-size:13.5px;flex:1}
.halves{display:grid;grid-template-columns:1fr 1fr}
.half{min-height:0!important;background:var(--bg)!important;padding:40px 36px 32px;display:flex;flex-direction:column;align-items:center;gap:30px}
.half+.half{border-left:1px solid var(--line2)}
.big{color:var(--ink)}
.lock{display:flex;align-items:center;gap:14px;color:var(--ink)}
.wm{font-weight:600;letter-spacing:-.045em;line-height:1;color:var(--ink)}
.wm .os{font-family:'Geist Mono',ui-monospace,monospace;font-weight:500;letter-spacing:0;color:var(--ink3);margin-left:.18em;font-size:.62em;vertical-align:.1em}
.sizes{display:flex;align-items:flex-end;gap:22px;color:var(--ink)}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.sizes figcaption{font-family:'Geist Mono';font-size:10.5px;color:var(--ink3)}
.tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:8px 8px 0 0;background:var(--p2);border:1px solid var(--line);border-bottom:0;font-size:12px;color:var(--ink2)}
.tile{border-radius:22.5%;display:grid;place-items:center;position:relative;overflow:hidden}
.tile.dk{--bg:#0b0c0f;background:linear-gradient(160deg,#1a1e27,#0b0c0f);color:#eceef2;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 30px -14px rgba(0,0,0,.6)}
.tile.lt{--bg:#ffffff;background:linear-gradient(160deg,#ffffff,#eeeee9);color:#15171b;box-shadow:inset 0 1px 0 #fff,0 14px 30px -16px rgba(20,22,26,.35),0 0 0 1px rgba(20,22,26,.06)}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:18px 22px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.why b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.rec{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;background:var(--amb-s);color:var(--amber-fg);font-size:12px;font-weight:500}
.cons{display:grid;grid-template-columns:420px minmax(0,1fr);gap:40px;padding:28px;border:1px solid var(--line2);border-radius:16px;background:var(--p1);margin-bottom:28px}
.cons ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px;line-height:1.65}
.cons li b{color:var(--ink);font-weight:500}
.cons h3{font-size:15px;font-weight:600;margin:0 0 10px}
.cons .code{font-family:'Geist Mono';font-size:12px;color:var(--ink2);background:var(--code-bg);border:1px solid var(--line);border-radius:9px;padding:12px;white-space:pre;margin-top:14px;overflow-x:auto}

/* kolo 2 */
.d2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border:1px solid var(--line2);border-radius:18px;overflow:hidden;margin-bottom:28px;background:var(--p1)}
.hs{position:relative;min-height:470px;display:grid;place-items:center;color:var(--ink);background:radial-gradient(420px 300px at 50% 48%,color-mix(in srgb,var(--glow) 16%,transparent),transparent 72%),var(--bg);transition:background 1.2s;overflow:hidden}
.hs .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(360px 260px at 50% 50%,#000,transparent 75%);-webkit-mask-image:radial-gradient(360px 260px at 50% 50%,#000,transparent 75%);opacity:.6}
.hs .stc{position:absolute;left:20px;bottom:18px;display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 11px;border-radius:99px;background:var(--p2);border:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.hs .stc .dot{width:7px;height:7px}
.hs .cap2{position:absolute;right:20px;bottom:20px;font-size:12px;color:var(--ink3);max-width:260px;text-align:right}
.sd{padding:28px 30px;display:flex;flex-direction:column;gap:22px;border-left:1px solid var(--line2)}
.sd .nm{display:flex;align-items:baseline;gap:12px}
.sd .nm b{font-size:24px;font-weight:600;letter-spacing:-.03em}
.sd .story{font-size:14.5px;line-height:1.6;color:var(--ink2);margin:0;text-wrap:pretty}
.sd .story strong{color:var(--ink);font-weight:500}
.sd .row2{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.sd figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.sd figcaption{font-family:'Geist Mono';font-size:10.5px;color:var(--ink3)}
.sd .pros{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12.5px;color:var(--ink2);padding-top:16px;border-top:1px solid var(--line)}
.sd .pros b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.wm2{font-weight:700;letter-spacing:-.065em;line-height:1;color:var(--ink)}
.wm2 .os{font-family:'Geist Mono',ui-monospace,monospace;font-weight:500;letter-spacing:0;color:var(--ink3);font-size:.5em;margin-left:.25em;vertical-align:.35em}
.blob{transform-box:fill-box;transform-origin:center;transition:fill 1.2s ease}
.blob.a1{animation:bd1 7s ease-in-out infinite}.blob.a2{animation:bd2 9s ease-in-out infinite}.blob.a3{animation:bd3 6s ease-in-out infinite}
@keyframes bd1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14px,10px) scale(1.25)}}
@keyframes bd2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-12px,-14px) scale(.85)}}
@keyframes bd3{0%,100%{transform:translate(0,0)}33%{transform:translate(-10px,12px)}66%{transform:translate(10px,4px)}}
.dvo{animation:dvo 3.6s cubic-bezier(.6,0,.2,1) infinite}
@keyframes dvo{0%,100%{transform:translate(1px,1px)}30%,72%{transform:translate(6px,6px)}50%{transform:translate(7px,7px)}}
.trl1{animation:trl 1.8s ease-in-out infinite}.trl2{animation:trl 1.8s ease-in-out .15s infinite}
@keyframes trl{0%,100%{transform:translate(0,0);opacity:var(--o)}50%{transform:translate(-3px,0);opacity:calc(var(--o) * .4)}}
@media (prefers-reduced-motion:reduce){.blob,.dvo,.trl1,.trl2{animation:none!important}}

/* kolo 2 bez Z */
.wl,.wr{transform-box:fill-box}
.wl{transform-origin:100% 50%}.wr{transform-origin:0% 50%}
.kg{transform-box:fill-box;transform-origin:center;transition:fill 1s}
.live .kg{animation:kg 3.2s ease-in-out infinite}
.live.working .kg{animation-duration:1.1s}
.live.needs .kg{animation-duration:1.8s}
.live.idle .kg{animation-duration:4.5s}
@keyframes kg{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.35);opacity:1}}
.kr{transform-box:fill-box;transform-origin:center;opacity:0;animation:kr 1.8s ease-out infinite}
@keyframes kr{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.kd{transition:fill 1s}
.spk .kg{opacity:0;animation:kgin .8s ease .7s forwards}
@keyframes kgin{to{opacity:.9}}
@keyframes wing{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86)}}
.unL,.unR{transform:scaleX(0);animation:unf .7s cubic-bezier(.3,1.4,.5,1) .15s forwards}
@keyframes unf{to{transform:scaleX(1)}}
.pup{transition:transform .7s cubic-bezier(.4,0,.2,1)}
.orbit{transform-box:view-box;transform-origin:32px 32px;animation:orb 2.4s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.blink{transform-box:view-box;transform-origin:32px 32px;animation:blk 4.6s ease-in-out infinite}
@keyframes blk{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.lid{transform-box:view-box;transform-origin:12px 44px;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.knobp{transform-box:fill-box;transform-origin:center;animation:kp 1.2s ease-in-out infinite}
@keyframes kp{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.wm3{font-weight:700;letter-spacing:-.065em;line-height:1;color:var(--ink)}
.wm3 i{font-style:normal;color:var(--amber)}
@media (prefers-reduced-motion:reduce){.wl,.wr,.orbit,.blink,.knobp,.kg,.kr{animation:none!important}.unL,.unR{transform:none}.spk .kg{opacity:.9}}
/* splash */
.spl{position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(640px 420px at 50% 44%,color-mix(in srgb,var(--amber) 7%,transparent),transparent 70%),var(--bg)}
.spl.desk{height:900px}
.spl .c{display:flex;flex-direction:column;align-items:center;gap:22px;color:var(--ink)}
.spl .st{font-family:'Geist Mono';font-size:12px;color:var(--ink3);height:18px;display:flex;align-items:center;gap:8px}
.spl .pb{width:220px;height:2px;border-radius:2px;background:var(--line2);overflow:hidden}
.spl .pb i{display:block;height:100%;background:var(--ink2);transition:width .45s cubic-bezier(.4,0,.2,1)}
.spl .greet{font-size:15px;color:var(--ink2);text-align:center;opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s;max-width:320px;line-height:1.5}
.spl .greet.on{opacity:1;transform:none}
.spl .greet b{color:var(--amber-fg);font-weight:500}
.spl .foot{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:10px;font-family:'Geist Mono';font-size:11px;color:var(--ink3)}
.spl .ghostgrid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(520px 360px at 50% 46%,#000,transparent 75%);-webkit-mask-image:radial-gradient(520px 360px at 50% 46%,#000,transparent 75%);opacity:.5}
.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:zdraw .95s cubic-bezier(.6,0,.2,1) .1s forwards}
.nd{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:zpop .38s cubic-bezier(.3,1.6,.5,1) forwards}
.n1{animation-delay:.05s}.n2{animation-delay:.4s}.n3{animation-delay:.68s}.n4{animation-delay:1.02s}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:zring 1.8s ease-out 1.35s infinite}
.wmin{opacity:0;transform:translateY(6px);animation:zup .6s ease 1.05s forwards}
@keyframes zdraw{to{stroke-dashoffset:0}}
@keyframes zpop{to{transform:scale(1)}}
@keyframes zring{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
@keyframes zup{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0}.nd{transform:none}.wmin{opacity:1;transform:none}.ring{display:none}}
.phs{display:flex;gap:44px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:14px auto 64px}
.phs .lbl2{font-size:12px;color:var(--ink3);margin:0 0 10px;text-align:center}
.stage.phone .spl{height:100%}
</style>
</helmet>

  <nav class="vt" aria-label="Pohledy brandu">
    <span class="lbl">ZibbyOS · brand</span>
    <sc-for list="{{ views }}" as="v" hint-placeholder-count="4">
      <button class="vtb" aria-pressed="{{ v.on }}" onClick="{{ v.pick }}">{{ v.label }}</button>
    </sc-for>
    <span style="flex:1"></span>
    <sc-if value="{{ isSplash }}" hint-placeholder-val="{{ false }}">
      <button class="btn sm" onClick="{{ replay }}" style="margin-right:8px">↻ Přehrát znovu</button>
    </sc-if>
    <div class="seg" role="group" aria-label="Téma">
      <sc-for list="{{ themes }}" as="t" hint-placeholder-count="2">
        <button aria-pressed="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </nav>
  {{ page }}
</div>
</x-dc>
