<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZibbyOS — Znalosti (mozek)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<style>
.bz{--kb:#5fd4c4}
.bz[data-theme=light]{--kb:#0f766e}
.k-wrap{width:1440px;max-width:calc(100% - 40px);margin:0 auto}
.k-stage{position:relative;margin:14px auto 56px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bz a:focus-visible,.bz input:focus-visible,.bz textarea:focus-visible,.bz select:focus-visible,.k-cv:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.k-cv:focus-visible{outline-offset:-2px}
/* chrome */
.k-h{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;background:var(--p1);border-bottom:1px solid var(--line);flex:none}
.k-brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600;letter-spacing:-.03em;font-size:14.5px;border-radius:8px;padding:4px}
.k-sec{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
.k-sec a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 8px;border-radius:7px;color:var(--ink3);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.k-sec a.io{width:30px;padding:0;justify-content:center}
.k-sec a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.k-sec a[aria-current=page]{color:var(--ink);background:var(--p3);box-shadow:0 0 0 1px var(--line2)}
.bz[data-theme=light] .k-sec a[aria-current=page]{background:var(--p1);box-shadow:0 1px 2px rgba(20,22,26,.08),0 0 0 1px var(--line2)}
.k-cmd{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:12.5px;white-space:nowrap}
.k-cmd:hover{color:var(--ink);border-color:var(--ink3)}
.k-zib{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:500;white-space:nowrap}
.k-zib:hover{background:var(--p2)}
.k-orb{width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--sky) 85%,#fff) 0%,var(--violet) 72%)}
.k-av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p3);border:1px solid var(--line2);font-size:10.5px;font-weight:600;flex:none}
.k-ctx{display:flex;align-items:stretch;height:42px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.k-tabs{display:flex;align-items:stretch;gap:2px}
.k-tabs a{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:var(--ink3);font-size:13px;text-decoration:none;white-space:nowrap}
.k-tabs a:hover{color:var(--ink)}
.k-tabs a[aria-current=page]{color:var(--ink);font-weight:500}
.k-tabs a[aria-current=page]::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--ink)}
.k-cnt{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:500;min-width:18px;height:17px;padding:0 5px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink2);display:inline-grid;place-items:center}
.k-cnt.amb{background:var(--amb-s);color:var(--amber-fg)}
/* page head */
.k-ph{display:flex;align-items:center;gap:16px;padding:11px 16px;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:6;background:var(--bg)}
.k-tt h1{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.k-count{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap}
.k-srcbtn{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 6px;border-radius:6px;color:var(--ink2)}
.k-srcbtn:hover,.k-srcbtn[aria-expanded=true]{background:var(--p2);color:var(--ink)}
.k-dots{display:inline-flex;gap:3px;align-items:center}
.k-dots .dot{width:6px;height:6px}
.k-search{flex:1;max-width:440px;min-width:200px;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--p1);color:var(--ink3)}
.k-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:13px}
.k-search input::placeholder{color:var(--ink3)}
.k-search:focus-within{border-color:var(--ink2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.k-search input:focus-visible{outline:0}
.k-hits{font-size:11px;color:var(--ink2);white-space:nowrap}
.k-acts{display:flex;align-items:center;gap:6px}
.k-vsep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ink:hover{background:color-mix(in srgb,var(--ink) 84%,var(--bg))}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.spin{animation:spin 1.1s linear infinite;display:inline-flex}
/* zones */
.k-zones{display:flex;min-height:0;position:relative}
.k-za{position:relative;min-width:0;overflow:hidden;background:var(--bg)}
.k-cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.k-split{flex:none;width:10px;position:relative;cursor:col-resize;display:grid;place-items:center;z-index:4;background:var(--bg)}
.bz .k-split{text-align:center}
.k-split::before{content:'';position:absolute;top:0;bottom:0;left:4.5px;width:1px;background:var(--line2)}
.k-split .grip{position:relative;width:4px;height:30px;border-radius:4px;background:var(--line2)}
.k-split:hover .grip,.k-split:focus-visible .grip{background:var(--ink3)}
.k-zb{flex:1;min-width:0;display:flex;min-height:0;background:var(--p1)}
/* nav: graph and tree are two views of the same data, only one is open; the other folds into a rail */
.k-nav{position:relative;min-width:0;overflow:hidden;flex:0 0 44px;transition:flex-basis .55s cubic-bezier(.65,0,.25,1)}
.k-nav.g{background:var(--bg)}
.k-nav.t{background:var(--p1);border-right:1px solid var(--line)}
.k-nav.g:not(.on){border-right:1px solid var(--line)}
.k-zones.drag .k-nav{transition:none}
.k-navc{position:absolute;inset:0;display:flex;opacity:1;transition:opacity .35s ease .2s}
.k-nav:not(.on) .k-navc{opacity:0;pointer-events:none;transition:opacity .18s ease}
.k-nav .k-tree{width:100%;border-right:0}
.k-navr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:16px;background:var(--p1);color:var(--ink2);font-size:12px;animation:knr .3s ease .3s both}
.k-navr:hover{color:var(--ink);background:var(--p2)}
.k-navr span{writing-mode:vertical-rl;transform:rotate(180deg)}
@keyframes knr{from{opacity:0}}
.k-rail{flex:none;width:44px;display:flex;justify-content:center;padding-top:10px;background:var(--p1);border-right:1px solid var(--line)}
.k-railb{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 6px;border-radius:8px;color:var(--ink2);font-size:12px}
.k-railb span{writing-mode:vertical-rl;transform:rotate(180deg)}
.k-railb:hover{background:var(--p2);color:var(--ink)}
/* overlays */
.k-ov{position:absolute;z-index:3}
.k-fbar{top:10px;left:12px;right:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.k-fc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;color:var(--ink3);border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);white-space:nowrap}
.k-fc:hover{color:var(--ink);border-color:var(--ink3)}
.k-fc[aria-pressed=true]{color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,var(--bg));border-color:color-mix(in srgb,var(--ink) 26%,transparent)}
.k-fc[aria-pressed=false] .shp{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
.k-fc .x{display:inline-flex;margin-right:-3px;opacity:.7}
.k-fsep{width:1px;height:16px;background:var(--line2);margin:0 2px}
.k-fclr{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;padding:0 4px;white-space:nowrap}
.k-anc{position:relative;display:inline-flex}
.k-pop{position:absolute;z-index:30;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop)}
.k-menu{top:calc(100% + 6px);left:0;min-width:210px;padding:5px}
.k-mi{display:flex;align-items:center;gap:9px;width:100%;min-height:30px;padding:0 8px;border-radius:7px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.k-mi:hover{background:var(--p2)}
.k-mi[aria-disabled=true]{color:var(--ink3);cursor:not-allowed}
.k-mi[aria-disabled=true]:hover{background:transparent}
.k-mi .ico{color:var(--ink3);display:inline-flex}
.k-mi small{margin-left:auto;color:var(--ink3);font-size:11px;padding-left:12px}
.k-mi .ck{margin-left:auto;display:inline-flex}
.k-msep{height:1px;background:var(--line);margin:5px -5px}
.shp{display:inline-block;flex:none;width:8px;height:8px}
.shp.c{border-radius:50%;background:var(--violet)}
.shp.s{border-radius:2.5px;background:var(--kb)}
.shp.r{border-radius:50%;width:11px;height:11px;border:1.5px solid var(--ink);background:radial-gradient(circle,var(--ink) 0 2px,transparent 2.4px)}
.shp.r.sm{width:10px;height:10px}
.shp.a{border-radius:50%;width:10px;height:10px;border:1.6px solid var(--amber)}
.shp.d{border-radius:50%;width:9px;height:9px;border:1.3px dashed var(--ink3)}
.k-leg{left:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);font-size:11.5px;color:var(--ink2)}
.k-leg div{display:flex;align-items:center;gap:8px}
.k-leg .ln{width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--ink2))}
.k-ctl{right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.k-mm{position:relative;width:176px;height:116px;border-radius:10px;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(6px);overflow:hidden}
.k-mm canvas{width:100%;height:100%;display:block;cursor:pointer}
.k-mml{position:absolute;left:8px;top:5px;font-size:10px;color:var(--ink3);font-family:'Geist Mono',monospace;pointer-events:none}
.k-cg{display:flex;align-items:center;gap:2px;padding:3px;border-radius:10px;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(6px)}
.k-cb{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink2)}
.bz .k-cb{text-align:center}
.k-cb:hover{background:var(--p2);color:var(--ink)}
.k-cb[aria-pressed=false]{color:var(--ink3);opacity:.75}
.k-cg .seg{padding:2px;border:0;background:transparent}
.k-cg .seg button{padding:3px 7px;font-size:11.5px}
.k-cgs{width:1px;height:18px;background:var(--line2);margin:0 3px}
.k-cgl{font-size:11px;color:var(--ink3);padding:0 2px 0 4px}
.k-colb{top:10px;right:12px}
.k-tip{position:absolute;z-index:8;width:300px;pointer-events:none;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:11px 13px 10px;display:flex;flex-direction:column;gap:6px;animation:kin .24s cubic-bezier(.2,.7,.2,1)}
.k-tiph{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.k-tipt{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.k-tipp{font-size:11px;color:var(--ink3);word-break:break-all}
.k-tipm{font-size:12px;color:var(--ink2)}
.k-tips{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k-tipf{display:flex;gap:12px;font-size:11.5px;color:var(--ink3);padding-top:7px;border-top:1px solid var(--line)}
.k-tipf b{color:var(--ink);font-weight:600;font-family:'Geist Mono',monospace}
@keyframes kin{from{opacity:0;transform:translateY(3px)}}
.k-sb{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
.k-sb.v{color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.k-sb.k{color:var(--kb);background:color-mix(in srgb,var(--kb) 12%,transparent)}
.k-sb.i{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.chip.run{color:var(--sky);background:color-mix(in srgb,var(--sky) 10%,transparent)}
/* tree */
.k-tree{flex:none;width:252px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.k-th{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);flex:none}
.k-th .ib{width:26px;height:26px}
.k-tl{flex:1;overflow:auto;padding:6px 6px 18px;scrollbar-width:thin}
.k-trow{position:relative;display:flex;align-items:center}
.k-ti{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:27px;padding:0 4px 0 calc(4px + var(--d) * 13px);border-radius:6px;color:var(--ink2);font-size:12.5px;white-space:nowrap}
.k-ti:hover{background:color-mix(in srgb,var(--ink) 4.5%,transparent);color:var(--ink)}
.k-ti[aria-selected=true]{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--ink)}
.k-ti.onpath{color:var(--ink)}
.k-ti.src{font-weight:500;color:var(--ink)}
.k-ti.root{font-weight:600;color:var(--ink)}
.k-ti.drop{background:color-mix(in srgb,var(--violet) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--violet) 45%,transparent)}
.k-ti .cv{width:12px;display:inline-flex;color:var(--ink3);transition:transform .12s;flex:none}
.k-ti .cv.o{transform:rotate(90deg)}
.k-ti .fi{display:inline-flex;color:var(--ink3);flex:none;width:14px;justify-content:center}
.k-ti .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.k-ti .n{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink3);font-weight:400}
.k-ti .lk{display:inline-flex;color:var(--ink3);opacity:.7}
.tb{font-size:10px;font-weight:500;padding:0 5px;height:16px;line-height:16px;border-radius:4px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink2);font-family:'Geist Mono',monospace}
.tb.amb{background:var(--amb-s);color:var(--amber-fg)}
.tb.new{background:color-mix(in srgb,var(--emerald) 13%,transparent);color:var(--emerald)}
.k-tmore{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--ink3);opacity:0;flex:none}
.bz .k-tmore{text-align:center}
.k-trow:hover .k-tmore,.k-tmore:focus-visible,.k-tmore[aria-expanded=true]{opacity:1}
.k-tmore:hover{background:var(--p3);color:var(--ink)}
.k-trow .k-menu{top:26px;left:auto;right:4px}
.k-ren{flex:1;min-width:0;height:25px;border-radius:6px;border:1px solid var(--ink2);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;padding:0 6px;margin-left:calc(26px + var(--d) * 13px)}
.k-trail{flex:none;width:44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px}
/* reader */
.k-rd{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--p1)}
.k-rh{padding:10px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
.k-rhb{display:flex;align-items:center;gap:6px;min-height:28px}
.k-bc{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.k-bc ol{display:flex;gap:3px;list-style:none;margin:0;padding:0;min-width:0;overflow:hidden;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.k-bc li{display:flex;gap:3px;align-items:center;white-space:nowrap}
.k-bc li+li::before{content:'/';opacity:.6}
.k-bc li:last-child{color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.k-bc button{color:inherit;font:inherit;border-radius:4px;padding:0 2px}
.k-bc button:hover{color:var(--ink);background:var(--p2)}
.k-rt{font-size:19px;font-weight:600;letter-spacing:-.022em;line-height:1.25;text-wrap:pretty}
.k-tin{font:inherit;font-size:19px;font-weight:600;letter-spacing:-.022em;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:3px 8px;width:100%}
.k-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.k-rb{flex:1;overflow:auto;padding:16px 18px 28px;min-height:0}
.k-md{max-width:680px}
.k-md h2{font-size:13.5px;font-weight:600;margin:18px 0 6px;letter-spacing:-.005em}
.k-md h2:first-child{margin-top:0}
.k-md p{color:var(--ink2);font-size:13.5px;line-height:1.65;margin:0 0 10px;text-wrap:pretty}
.k-md ul{margin:0 0 10px;padding-left:18px;color:var(--ink2);font-size:13.5px;line-height:1.7}
.k-wl{display:inline;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 28%,transparent);text-underline-offset:3px;border-radius:3px}
.k-wl:hover{text-decoration-color:currentColor}
.k-wl.k{color:var(--kb)}
.k-wl.un{color:var(--ink3);text-decoration-style:dashed}
.k-links{display:grid;gap:18px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);max-width:680px}
.k-links h3{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.k-lchips{display:flex;flex-wrap:wrap;gap:6px}
.k-lc{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--ink2)}
.k-lc span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.k-lc:hover{border-color:var(--line2);color:var(--ink)}
.k-mg{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.k-mg svg{position:absolute;inset:0;width:100%;height:100%}
.k-mgn{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2);white-space:nowrap;max-width:118px;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.k-mgn:hover{background:var(--p2);color:var(--ink)}
.k-mgn span:last-child{overflow:hidden;text-overflow:ellipsis}
.k-mgc{font-weight:600;color:var(--ink);background:var(--p2);border:1px solid var(--line2);font-size:11px;max-width:150px;padding:2px 7px}
.k-ro{display:flex;gap:10px;align-items:flex-start;margin:12px 18px 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--kb) 7%,transparent);border:1px solid color-mix(in srgb,var(--kb) 26%,transparent);font-size:12.5px;color:var(--ink2);flex:none}
.k-ro>span:first-child{color:var(--kb);margin-top:1px;display:inline-flex}
.k-ro b{color:var(--ink);font-weight:500}
