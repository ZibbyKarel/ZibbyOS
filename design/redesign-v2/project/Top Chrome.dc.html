<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZibbyOS — top chrome redesign</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<style>
.tc-wrap{width:1440px;max-width:calc(100% - 40px);margin:0 auto}
.tc-intro{padding:30px 0 4px}
.tc-intro h2{font-size:26px;font-weight:500;letter-spacing:-.03em;margin:0 0 6px}
.tc-intro p{color:var(--ink2);font-size:14px;max-width:820px;margin:0;text-wrap:pretty}
.tc-intro p b{color:var(--ink);font-weight:500}
.tc-stage{position:relative;margin:14px auto 56px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.tc-stage.glow::after,.ph.glow::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:70;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--violet) 70%,transparent),inset 0 0 46px color-mix(in srgb,var(--violet) 24%,transparent);animation:tcglow 3.2s ease-in-out infinite}
.tc-zpad{padding-top:32px;background:var(--p1)}
/* row 1 */
.tc-h{position:relative;z-index:40;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;background:var(--p1);border-bottom:1px solid var(--line)}
.tc-h.ap{border-bottom-color:color-mix(in srgb,var(--violet) 50%,transparent)}
.tc-zw{display:flex;align-items:center;gap:10px;flex:none}
.tc-z{gap:6px}
.tc-h.zones .tc-zw{position:relative;outline:1px dashed color-mix(in srgb,var(--sky) 65%,transparent);outline-offset:4px;border-radius:10px}
.tc-h.zones .tc-zw::before{content:attr(data-z);position:absolute;top:-27px;left:0;font:500 10.5px/1 'Geist Mono',monospace;letter-spacing:.04em;color:var(--sky);white-space:nowrap}
.tc-brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;border-radius:8px;padding:4px 4px 4px 2px;flex:none}
.tc-brand:focus-visible,.tc-sec a:focus-visible,.tc-tabs a:focus-visible,.tc-crumbs a:focus-visible,.tc-lk:focus-visible,.tc-sh-sec:focus-visible,.tc-sh-subs a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tc-wm{font-weight:600;letter-spacing:-.03em;font-size:14.5px}
.tc-sec{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
.tc-sec a{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 8px;border-radius:7px;color:var(--ink3);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.tc-sec a.io{padding:0;width:30px;justify-content:center}
.tc-sec a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tc-sec a[aria-current=page]{color:var(--ink);background:var(--p3);box-shadow:0 0 0 1px var(--line2)}
.bz[data-theme=light] .tc-sec a[aria-current=page]{background:var(--p1);box-shadow:0 1px 2px rgba(20,22,26,.08),0 0 0 1px var(--line2)}
.tc-sec a .att{position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--p1)}
.tc-sp{flex:1;min-width:8px}
.tc-div{width:1px;height:22px;background:var(--line2);flex:none;margin:0 4px}
.tc-cmd{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:12.5px;white-space:nowrap}
.tc-cmd:hover{color:var(--ink);border-color:var(--ink3)}
.tc-cmd.focus{border-color:var(--ink2);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.tc-new{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 8px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.tc-new:hover{background:color-mix(in srgb,var(--ink) 84%,var(--bg))}
.tc-new .cv{opacity:.55;margin-left:-1px}
.tc-new.io{width:30px;padding:0;justify-content:center}
.tc-zib{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1px solid var(--line2);color:var(--ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.tc-zib:hover{background:var(--p2)}
.tc-zib.att{border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:var(--amb-s)}
.tc-zib.io{width:32px;height:32px;padding:0;justify-content:center}
.tc-orb{position:relative;display:inline-block;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--sky) 85%,#fff) 0%,var(--violet) 72%);box-shadow:0 0 0 1px color-mix(in srgb,var(--violet) 30%,transparent)}
.tc-orb.att::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--amber)}
.tc-stat{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 7px 0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.tc-stat:hover{border-color:var(--line2);background:var(--p2)}
.tc-stat .n{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink)}
.tc-stat.att{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amb-s)}
.tc-stat.att .n{color:var(--amber-fg);font-weight:600}
.tc-stat .rings{display:inline-flex;gap:3px;padding-left:7px;border-left:1px solid var(--line)}
.tc-upd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:color-mix(in srgb,var(--sky) 15%,transparent);color:var(--sky)}
.tc-mode{display:inline-flex;align-items:stretch;height:30px;border-radius:8px;border:1px solid var(--line2)}
.tc-mode>button{display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tc-mode>button:first-child{border-radius:7px 0 0 7px}
.tc-mode>button:last-child{border-radius:0 7px 7px 0}
.tc-mode>button:only-child{border-radius:7px}
.tc-mode>button:hover{background:var(--p2);color:var(--ink)}
.tc-mode>button+button{border-left:1px solid var(--line2)}
.tc-mode.on{border-color:color-mix(in srgb,var(--violet) 60%,transparent)}
.tc-mode .ap[aria-pressed=true]{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet);font-weight:600}
.tc-mode.on>button+button{border-left-color:color-mix(in srgb,var(--violet) 40%,transparent)}
.tc-eng{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-family:'Geist Mono',monospace;font-size:9px;font-weight:600;background:var(--p3);color:var(--ink);border:1px solid var(--line2);flex:none}
.tc-ib{position:relative;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
.bz .tc-ib{text-align:center}
.tc-ib:hover{background:var(--p2);color:var(--ink)}
.tc-bell b{position:absolute;top:2px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:9.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--p1)}
.tc-bell b.amb{background:var(--amber);color:var(--on-amber)}
.tc-av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p3);border:1px solid var(--line2);font-size:10.5px;font-weight:600;color:var(--ink);flex:none}
.bz .tc-av{text-align:center}
.tc-av:hover{border-color:var(--ink3)}
.tc-av.big{width:36px;height:36px;font-size:12px}
.tc-apdot{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 25%,transparent);animation:tcpulse 1.6s ease-in-out infinite;flex:none}
.tc-node{transform-box:fill-box;transform-origin:center}
.tc-node.working{animation:tcpulse 1.3s ease-in-out infinite}
.tc-node.needs{animation:tcpulse 1.9s ease-in-out infinite}
/* popovers */
.tc-anc{position:relative;display:inline-flex}
.tc-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:45;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;font-size:12.5px;color:var(--ink);white-space:normal}
.tc-pop.l{left:0;right:auto}
.tc-mi{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 8px;border-radius:7px;color:var(--ink);text-decoration:none}
.tc-mi:hover,.tc-mi.hl{background:var(--p2)}
.tc-mi .ico{color:var(--ink3);display:inline-flex}
.tc-mi .k{margin-left:auto}
.tc-mi small{margin-left:auto;color:var(--ink3);font-size:11.5px}
.tc-mi[aria-disabled=true]{color:var(--ink3)}
.tc-sep{height:1px;background:var(--line);margin:6px -6px}
.tc-ph{padding:8px 8px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tc-pp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.tc-pp-h b{font-weight:600}
.tc-pp-b{padding:6px}
.tc-pp-sec{padding:2px 6px 8px;border-top:1px solid var(--line)}
.tc-row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 8px;border-radius:8px}
.tc-row .dot{justify-self:center}
.tc-row b{display:block;font-weight:500}
.tc-row small{display:block;color:var(--ink3);font-size:11.5px}
.tc-row.amb{background:color-mix(in srgb,var(--amber) 9%,transparent)}
.tc-mt{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:7px 8px}
.tc-mt .bar{grid-column:1/-1;height:5px}
.tc-mt small{grid-column:1/-1;color:var(--ink3);font-size:11.5px}
.tc-mt .mono{font-size:11.5px;color:var(--ink2)}
.tc-mt.hot .bar i{background:var(--amber)}
.tc-mt.hot .mono{color:var(--amber-fg)}
.tc-lk{color:var(--ink2);font-size:12px;text-decoration:none;border-radius:5px;padding:2px 4px;white-space:nowrap}
.tc-lk:hover{color:var(--ink)}
.tc-pp-f{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.tc-pp-upd{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid color-mix(in srgb,var(--sky) 30%,transparent);background:color-mix(in srgb,var(--sky) 8%,transparent);color:var(--sky);border-radius:0 0 11px 11px}
.tc-pp-upd b{display:block;color:var(--ink);font-weight:500}
.tc-pp-upd small{display:block;color:var(--ink2);font-size:11.5px}
.btn.sky{background:var(--sky);border-color:var(--sky);color:var(--on-status)}
.btn.sky:hover{background:color-mix(in srgb,var(--sky) 85%,var(--ink))}
.tc-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 4px}
.tc-mo{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:9px;border:1px solid var(--line2);font-size:12px;color:var(--ink2);line-height:1.4}
.tc-mo b{color:var(--ink);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.tc-mo:hover{border-color:var(--ink3)}
.tc-mo[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tc-mo.apm[aria-pressed=true]{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet);background:color-mix(in srgb,var(--violet) 9%,transparent)}
.tc-mo.apm[aria-pressed=true] b{color:var(--violet)}
.tc-scope{display:flex;align-items:center;gap:10px;padding:7px 14px;width:100%;color:var(--ink)}
.tc-scope>span{flex:1;min-width:0}
.tc-scope small{display:block;color:var(--ink3);font-size:11.5px}
.tc-scopes.off{opacity:.5}
.tc-sw{width:30px;height:18px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;flex:none;transition:background .15s}
.tc-sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.tc-sw[aria-checked=true]{background:var(--violet)}
.tc-sw[aria-checked=true]::after{transform:translateX(12px)}
.tc-mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px;font-size:12.5px;color:var(--ink2)}
.tc-mrow .seg button{display:inline-flex;align-items:center;gap:5px}
.tc-acct{display:flex;align-items:center;gap:10px;padding:8px}
.tc-acct b{display:block;font-weight:600;color:var(--ink)}
.tc-acct small{display:block;color:var(--ink3);font-size:11.5px}
.tc-mfoot{padding:6px 8px 4px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.tc-catch{position:absolute;inset:0;z-index:30}
/* palette */
.tc-scrim{position:absolute;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(2px)}
.tc-pal{position:absolute;z-index:51;top:76px;left:50%;transform:translateX(-50%);width:620px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden}
.tc-pal-in{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--ink3)}
.tc-pal-in input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px}
.tc-pal-g{padding:6px}
.tc-pal-z{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.tc-pal-z .kbd{margin-left:auto}
/* row 2 */
.tc-ctx{position:relative;z-index:10;display:flex;align-items:stretch;height:42px;padding:0 14px 0 14px;border-bottom:1px solid var(--line);gap:4px}
.tc-tabs{display:flex;align-items:stretch;gap:2px}
.tc-tabs a{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:var(--ink3);font-size:13px;text-decoration:none;white-space:nowrap}
.tc-tabs a:hover{color:var(--ink)}
.tc-tabs a[aria-current=page]{color:var(--ink);font-weight:500}
.tc-tabs a[aria-current=page]::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--ink)}
.tc-cnt{font-family:'Geist Mono',monospace;font-size:10.5px;font-weight:500;min-width:18px;height:17px;padding:0 5px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink2);display:inline-grid;place-items:center}
.tc-cnt.amb{background:var(--amb-s);color:var(--amber-fg)}
.tc-crumbs{display:flex;align-items:center;font-size:13px;color:var(--ink3);padding-left:6px}
.tc-crumbs ol{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0}
.tc-crumbs li{display:flex;align-items:center;gap:2px}
.tc-crumbs a{color:var(--ink3);text-decoration:none;padding:3px 5px;border-radius:5px}
.tc-crumbs a:hover{color:var(--ink);background:var(--p2)}
.tc-crumbs [aria-current=page]{color:var(--ink);font-weight:500;padding:3px 5px}
.tc-crumbs .sl{color:var(--ink3);opacity:.6}
.tc-crumbs a,.tc-ccur{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tc-ccur{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tc-crumbs .ci{display:inline-flex;color:var(--ink3);opacity:.8}
.tc-crumbs .mono{font-family:'Geist Mono',monospace;font-size:12px}
.tc-crumbs a.tab{font-style:normal;color:var(--ink3)}
.tc-csw{width:18px;height:22px;display:inline-grid;place-items:center;border-radius:5px;color:var(--ink3);margin-left:-2px}
.bz .tc-csw{text-align:center}
.tc-csw:hover,.tc-csw[aria-expanded=true]{background:var(--p2);color:var(--ink)}
.tc-cgap{height:22px;padding:0 7px;border-radius:5px;color:var(--ink3);font-weight:600;letter-spacing:.05em}
.tc-cgap:hover,.tc-cgap[aria-expanded=true]{background:var(--p2);color:var(--ink)}
.tc-mback{display:inline-flex;align-items:center;gap:2px;padding:0 6px;color:var(--ink2);text-decoration:none;font-size:13.5px}
.tc-mpath{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
/* site map */
.ia-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 10px}
.ia-d{border:1px solid var(--line);border-radius:12px;background:var(--p1);display:flex;flex-direction:column;min-width:0}
.ia-d.sys{background:transparent;border-style:dashed;border-color:var(--line2)}
.ia-dh{display:flex;align-items:center;gap:10px;padding:14px 14px 4px}
.ia-dh .t{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--ink)}
.ia-dh b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.ia-dh .pf{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.ia-q{padding:0 14px 10px 52px;font-size:12.5px;color:var(--ink2)}
.ia-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 14px;border-top:1px solid var(--line)}
.ia-it b{font-weight:500;font-size:13px}
.ia-it .r{grid-column:1/-1;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.ia-it .n{grid-column:1/-1;font-size:12px;color:var(--ink2)}
.ia-tag{font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:5px;align-self:center}
.ia-tag.moved{background:color-mix(in srgb,var(--sky) 14%,transparent);color:var(--sky)}
.ia-tag.merged{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.ia-tag.new{background:color-mix(in srgb,var(--emerald) 14%,transparent);color:var(--emerald)}
.ia-det{margin-top:auto;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.ia-pr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin:22px 0 8px;font-size:13px;color:var(--ink2);line-height:1.55}
.ia-pr b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.ia-stat{display:flex;gap:40px;margin:14px 0 0}
.ia-stat div{display:flex;flex-direction:column;gap:2px}
.ia-stat .n{font-size:30px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ia-stat .n s{color:var(--ink3);font-size:18px;margin-right:8px}
.ia-stat .l{font-size:12px;color:var(--ink3)}
.tc-cbar{position:relative;margin:8px auto 0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tc-cbar .tc-ctx{border-bottom:0}
.tc-clbl{display:flex;gap:14px;align-items:baseline;margin:22px auto 0;font-size:12.5px;color:var(--ink2)}
.tc-clbl b{color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap}
.tc-pin{align-self:center;width:26px;height:26px;display:inline-grid;place-items:center;border-radius:6px;color:var(--ink3);margin-left:4px;flex:none}
.bz .tc-pin{text-align:center}
.tc-pin:hover{background:var(--p2);color:var(--ink)}
.tc-pin[aria-pressed=true]{color:var(--ink)}
.tc-acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.tc-acts .ib{width:28px;height:28px}
.bz .tc-acts .seg button{display:inline-flex;align-items:center}
/* page stub */
.tc-page{padding:22px 24px 28px;display:flex;flex-direction:column;gap:14px}
.tc-page h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.tc-sk{height:10px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tc-card{border:1px solid var(--line);border-radius:10px;background:var(--p1);padding:14px;display:flex;flex-direction:column;gap:9px}
.tc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
/* notes, sim */
.tc-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:-38px auto 60px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.tc-notes b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.tc-sim{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink3)}
.tc-sim .fchips{padding:0}
/* phone */
.tc-mbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 6px;background:var(--p1);border-bottom:1px solid var(--line);position:relative;z-index:5}
.tc-mbar .tc-brand{padding:4px}
.tc-mtitle{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.tc-badot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--p1)}
.tc-apband{display:flex;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--ink2);font-size:12.5px;border-bottom:1px solid color-mix(in srgb,var(--violet) 40%,transparent)}
.tc-apband b{color:var(--violet);font-weight:600}
.tc-apband .tc-lk{margin-left:auto;color:var(--violet);font-weight:500}
.tc-mctx{display:flex;align-items:stretch;height:42px;border-bottom:1px solid var(--line);padding:0 4px 0 2px}
.tc-mctx .tc-tabs{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tc-mctx .ib{align-self:center}
.ph .tc-page{padding:16px}
.ph .tc-grid{grid-template-columns:1fr}
.tc-sheetwrap{position:absolute;inset:0;z-index:60}
.tc-sheetscrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.tc-sheet{position:absolute;left:0;top:0;bottom:0;width:88%;background:var(--sheet);border-right:1px solid var(--line2);overflow-y:auto;padding:50px 12px 40px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-pop);scrollbar-width:none}
.tc-sh-top{display:flex;align-items:center;gap:8px;padding:0 2px 6px;color:var(--ink)}
.tc-sh-top b{font-weight:600;letter-spacing:-.02em}
.tc-cmd.wide{width:100%;height:40px;font-size:13.5px}
.tc-sh-create{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.tc-sh-create>*{height:40px;justify-content:center}
.tc-sh-lbl{padding:14px 6px 4px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tc-sh-sec{display:flex;align-items:center;gap:12px;height:42px;padding:0 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-size:14.5px}
.tc-sh-sec .lb{flex:1}
.tc-sh-sec.on{background:var(--p2);color:var(--ink);font-weight:500}
.tc-sh-subs{display:flex;flex-direction:column;margin:2px 0 6px 19px;padding-left:16px;border-left:1px solid var(--line2)}
.tc-sh-subs a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;padding:0 10px;color:var(--ink3);text-decoration:none;font-size:14px;border-radius:8px}
.tc-sh-subs a[aria-current=page]{color:var(--ink);font-weight:500;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tc-sh-card{border:1px solid var(--line);border-radius:12px;background:var(--p1);padding:6px}
.tc-sh-link{text-decoration:none}
.tc-sh-ver{display:flex;align-items:center;gap:8px;padding:9px 8px 5px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);margin-top:4px}
/* spec */
.spec .tc-tag{display:inline-block;font-family:'Geist Mono',monospace;font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--p2);color:var(--ink2);margin-left:6px;vertical-align:1px}
.spec .tc-tag.new{background:color-mix(in srgb,var(--sky) 14%,transparent);color:var(--sky)}
.spec .tc-tag.chg{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--violet)}
.spec td code{white-space:normal}
@keyframes tcpulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes tcglow{0%,100%{opacity:.75}50%{opacity:1}}
</style>

  </nav>
  {{ page }}
</div>

        h('li', null, 'Autopilot: ', c('aria-pressed'), ' on the trigger, option cards with ', c('aria-pressed'), ', scopes as ', c('role=switch'), '. Engine items are ', c('menuitemradio'), '.'),
        h('li', null, 'Focus ring stays the existing 2 px ring with 2 px offset; popovers trap arrow keys, Esc returns focus to the trigger.'),
        h('li', null, 'Inactive labels use --ink3 on the panel (≥ 4.5:1 in both themes). Counters and badges never rely on colour alone: they carry a number.'),
        h('li', null, 'prefers-reduced-motion: knot pulse, Autopilot dot and ScreenGlow stop animating; the glow stays as a static border.')),
      h('h2', null, 'Shortcuts shown in the UI'),
      h('p', null, c('⌘K'), ' search · ', c('⌥N'), ' new task · ', c('⌥⇧N'), ' new note (proposed) · ', c('⌘,'), ' settings · ', c('?'), ' shortcuts · Zibby summon (', c('⌘J'), ' is a placeholder in this mock; keep the current binding).'));
  }

  iaPage() {
    const h = this.h, T = { moved: 'moved', merged: 'merged', new: 'new in menu' };
    return h('div', { className: 'tc-wrap' },
      h('div', { className: 'tc-intro' }, h('h2', null, 'Site map — six domains'),
        h('p', null, 'Each section answers one question, owns one URL prefix and is the ', h('b', null, 'only home'), ' of the things in it. Today Activity is not a domain but a kind of view: it holds the log, runs, approvals, pull requests and channels that belong elsewhere. AI mixes who does the work (agents) with registries under /system. This proposal dissolves Activity, renames AI to Workforce and Companies to Portfolio, and moves every “waits for me” item into one Inbox. Rule of thumb between the two work-ish domains: ', h('b', null, 'Workforce defines who and how'), ' (departments, agents, workflows, capabilities); ', h('b', null, 'Work decides what and when, and records what ran'), ' (goals, automations, runs).'),
        h('div', { className: 'ia-stat' },
          h('div', null, h('span', { className: 'n' }, h('s', null, '8'), '6'), h('span', { className: 'l' }, 'sections in the track (+ Settings in the system menu)')),
          h('div', null, h('span', { className: 'n' }, h('s', null, '35'), '25'), h('span', { className: 'l' }, 'sub-pages in menus')),
          h('div', null, h('span', { className: 'n' }, h('s', null, '3'), '1'), h('span', { className: 'l' }, 'lists of pull requests')),
          h('div', null, h('span', { className: 'n' }, h('s', null, '2'), '1'), h('span', { className: 'l' }, 'approval queues')),
          h('div', null, h('span', { className: 'n' }, h('s', null, '10'), '7'), h('span', { className: 'l' }, 'URL roots, one per domain')))),
      h('div', { className: 'ia-grid' }, this.IA.map(d => { const s = this.sec(d.id); return h('section', { key: d.id, className: 'ia-d' + (d.id === 'settings' ? ' sys' : ''), 'aria-label': s.label },
        h('div', { className: 'ia-dh' }, h('span', { className: 't' }, this.ic(s.icon, 16)), h('b', null, s.label), h('span', { className: 'pf' }, d.prefix)),
        h('div', { className: 'ia-q' }, d.q),
        d.items.map((it, i) => h('div', { className: 'ia-it', key: i }, h('b', null, it[0]), it[2] ? h('span', { className: 'ia-tag ' + it[2] }, T[it[2]]) : h('span', null), h('span', { className: 'r' }, it[1]), it[3] ? h('span', { className: 'n' }, it[3]) : null)),
        h('div', { className: 'ia-det' }, d.det)); }),
        h('section', { className: 'ia-d sys', 'aria-label': 'Not pages' },
          h('div', { className: 'ia-dh' }, h('span', { className: 't' }, this.ic('more', 16)), h('b', null, 'Overlays, not pages')),
          h('div', { className: 'ia-q' }, 'Opened from the chrome, available everywhere'),
          ['Command palette · ⌘K', 'Zibby overlay', 'New note (floating)', 'Approval sheet · ?approval=', 'Pin dialog', 'Autopilot dialog', 'Notifications'].map((l, i) => h('div', { className: 'ia-it', key: i }, h('b', { style: { fontWeight: 400 } }, l))))),
      h('div', { className: 'ia-pr' },
        h('div', null, h('b', null, 'One home per thing'), 'A pull request, approval or run lives in exactly one place. Elsewhere it appears as a widget or a link that opens that place (Bridge widgets, Spend → Budgets).'),
        h('div', null, h('b', null, 'Waiting = Inbox'), 'Approvals, issues, PRs for review and incoming messages are one queue with type filters, so the Inbox counter is the single number that matters.'),
        h('div', null, h('b', null, 'Entities have tabs, not menus'), 'Project Overview/Profile/Secrets/Integrations/Roadmap and department tabs stay inside the page. The menu only lists collections.'),
        h('div', null, h('b', null, 'Domain = URL prefix'), 'Every route starts with its domain, so the breadcrumb and the active pill can be derived from the URL alone.')),
      h('div', { className: 'spec', style: { width: '100%', margin: '30px 0 80px' } },
        h('h2', null, 'Route changes'),
        h('table', null, h('thead', null, h('tr', null, h('th', null, 'Today'), h('th', null, 'Proposed'), h('th', null, 'Change'))),
          h('tbody', null, this.MAP.map((r, i) => h('tr', { key: i }, h('td', null, h('code', null, r[0])), h('td', null, h('code', null, r[1])), h('td', null, r[2]))))),
        h('p', { style: { marginTop: 12 } }, 'Unchanged: Bridge, Briefings, Goals, Automations, New task, Agents, Marketplaces, Vault, Graph, Distill, Gates, Budgets, Spend, General, Runtime, Status. Two items marked (?) in your map — Patterns and Activity settings — need a content check before merging.')));
  }
  crumbsPage() {
    const h = this.h, bar = (o, w, ht) => h('div', { className: 'tc-cbar', style: { width: w || 1440, height: ht } }, this.ctx(Object.assign({ sec: 'companies', detail: true }, o)));
    const lbl = (t, d, w) => h('div', { className: 'tc-clbl', style: { width: w || 1440 } }, h('b', null, t), h('span', null, d));
    const P = this.CR.project, PI = P.concat(this.CR.integ);
    return h('div', { className: 'tc-wrap' },
      h('div', { className: 'tc-intro' }, h('h2', null, 'Breadcrumbs'),
        h('p', null, 'On every detail page the breadcrumb replaces the sub-page tabs in row 2. It follows the ', h('b', null, 'ownership chain'), ', not the route you came by, so the same page always shows the same path. The section is already shown by the active pill, so the first crumb is the collection (sub-page) you can go back to.')),
      lbl('Project → integration, full', 'Companies / Acme Corp / Platform / acme-web / Integrations / GitHub. Entity crumbs carry a type icon and a ⇕ switcher; “Integrations” is a tab of acme-web, so it links to that tab.'),
      bar({ crumbs: PI, sec: 'companies' }),
      lbl('Switcher open', 'Jump to a sibling (another project in Platform) and stay on the same tab or child if it exists there.'),
      bar({ crumbs: PI, open: 'sw3' }, 1440, 300),
      lbl('Narrow — collapsed', 'When it does not fit, the levels after the first collapse into “…”; the last three always stay. The current crumb truncates last.', 1024),
      bar({ crumbs: PI, collapse: true, lv: 2, open: 'gap' }, 1024, 200),
      lbl('Other domains', 'Same rules everywhere. IDs only when there is no name (runs, issue keys) — in mono.'),
      bar({ crumbs: this.CR.run, sec: 'work' }),
      bar({ crumbs: this.CR.dept, sec: 'workforce' }),
      bar({ crumbs: this.CR.cap, sec: 'workforce' }),
      bar({ crumbs: this.CR.issue, sec: 'dashboard' }),
      bar({ crumbs: this.CR.note, sec: 'knowledge' }),
      bar({ crumbs: this.CR.settings, sec: 'settings', inSettings: true }),
      lbl('Phone', 'One back link to the parent in the context row; the full path sits under the title and opens as a list on tap.'),
      h('div', { style: { display: 'flex', gap: 36, justifyContent: 'center', margin: '18px auto 20px' } }, this.phone({ sec: 'companies', crumbs: PI })),
      h('div', { className: 'spec', style: { width: '100%', margin: '30px 0 80px' } },
        h('h2', null, 'Rules'),
        h('table', null, h('tbody', null, [
          ['Start', 'The collection sub-page of the root entity (Companies, Runs, Departments, Inbox…). Never the section name — the pill already says it.'],
          ['Chain', 'Ownership: company → team → project → child. A project without a team skips the team. Derived from data, not history.'],
          ['Entity crumb', 'Name + type icon. Mono only for IDs without a name (#4821, ACME-142). ⇕ switcher on entities that have siblings.'],
          ['Tab crumb', 'A tab appears only when you drill into a child record (Integrations › GitHub, Workflows › Delivery loop). On the tab itself the breadcrumb ends at the entity and the tab is selected in the page.'],
          ['Filter crumb', 'Inbox filters behave like tabs: Inbox / Issues / ACME-142 links back to the filtered queue.'],
          ['Current', 'Last crumb, not a link, aria-current=page, truncates with a tooltip at 260 px. Same text as the page H1.'],
          ['Pin', 'Pin icon right after the current crumb pins exactly this entity/child.'],
          ['Collapse', 'First crumb + “…” menu + last three. Collapsing is measured, like the header.'],
          ['A11y', 'nav[aria-label=Breadcrumb] > ol; separators aria-hidden; switcher is a button with aria-label “Switch project”.'],
          ['Component', 'Breadcrumb { items: { label, href?, icon?, mono?, kind?, siblings?: () => Promise<Item[]>, isTab? }[], collapse: "measure" | "none", trailing?: ReactNode }. Items come from a per-route resolver (useBreadcrumb(route)), so pages no longer portal their own crumbs.']
        ].map((r, i) => h('tr', { key: i }, h('td', null, r[0]), h('td', null, r[1])))))));
  }

  renderVals() {
    const v = this.view();
    const VL = [['ia', 'Site map'], ['crumbs', 'Breadcrumbs'], ['desk', 'Desktop states'], ['menus', 'Menus & popovers'], ['narrow', 'Narrow desktop'], ['phone', 'Phone'], ['spec', 'Rationale & components']];
    return {
      views: VL.map(([k, l]) => ({ label: l, on: v === k, pick: () => this.setState({ view: k, open: null }) })),
      themes: [['dark', 'Dark'], ['light', 'Light']].map(([k, l]) => ({ label: l, on: this.theme() === k, pick: () => this.setTheme(k) })),
      theme: this.theme(),
      page: v === 'ia' ? this.iaPage() : v === 'crumbs' ? this.crumbsPage() : v === 'desk' ? this.deskPage() : v === 'menus' ? this.menusPage() : v === 'narrow' ? this.narrowPage() : v === 'phone' ? this.phonePage() : this.specPage()
    };
  }
}
