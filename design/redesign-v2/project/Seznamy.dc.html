<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZibbyOS — seznamy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<style>
/* ---------- popisky nad pódiem ---------- */
.ls-cap{width:1440px;max-width:calc(100% - 40px);margin:28px auto 0}
.ls-cap .t{display:flex;align-items:baseline;gap:14px}
.ls-cap h2{font-size:24px;font-weight:600;letter-spacing:-.03em}
.ls-cap .r{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink3)}
.ls-rat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);line-height:1.55;text-wrap:pretty}
.ls-rat b{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.ls-lbl{width:1440px;max-width:calc(100% - 40px);margin:26px auto 0;font-size:12px;color:var(--ink3);display:flex;gap:8px}
.ls-phs{display:flex;justify-content:center;margin:14px auto 64px}
.ls-phs .stage.phone{margin:0}

/* ---------- společný rám stránky ---------- */
.ls-app{background:var(--bg)}
.ls-top{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:var(--p1);border-bottom:1px solid var(--line)}
.ls-brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.03em;font-size:14.5px;color:var(--ink);margin-right:6px}
.ls-nav{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
.ls-nav a{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:7px;color:var(--ink3);font-size:12.5px;font-weight:500;text-decoration:none}
.ls-nav a:hover{color:var(--ink)}
.ls-nav a[aria-current=page]{color:var(--ink);background:var(--p3);box-shadow:0 0 0 1px var(--line2)}
.bz[data-theme=light] .ls-nav a[aria-current=page]{background:var(--p1);box-shadow:0 1px 2px rgba(20,22,26,.08),0 0 0 1px var(--line2)}
.ls-sp{flex:1;min-width:8px}
.ls-cmd{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:12.5px;width:260px}
.ls-cmd span:first-of-type{flex:1}
.ls-me{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--p3);border:1px solid var(--line2);font-size:10.5px;font-weight:600}
.ls-head{display:flex;align-items:flex-end;gap:10px;padding:28px 32px 0}
.ls-head .tt{flex:1;min-width:0}
.ls-crumb{font-size:12px;color:var(--ink3);margin-bottom:6px}
.ls-head h1{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.ls-cnt{font-size:13px;color:var(--ink3);margin-top:5px;min-height:20px}
.ls-cnt .a{color:var(--amber-fg);font-weight:500}
.ls-cnt .v{color:var(--violet);font-weight:500}
.ls-cnt .r{color:var(--rose);font-weight:500}
.bz .ls-new{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:500;white-space:nowrap;text-align:center}
.bz .ls-new:hover{background:color-mix(in srgb,var(--ink) 84%,var(--bg))}
.bz .ls-new.io{width:36px;height:36px;padding:0;justify-content:center;border-radius:11px}
.bz .ls-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--line2);color:var(--ink);white-space:nowrap;background:transparent;text-align:center}
.bz .ls-btn:hover{background:var(--p2)}
.bz .ls-btn.sm{height:28px;padding:0 10px;font-size:12px}
.bz .ls-btn.amb{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.bz .ls-btn.amb:hover{background:var(--amber-hover)}
.bz .ls-btn.gh{border-color:transparent;color:var(--ink2)}
.bz .ls-btn.gh:hover{color:var(--ink)}
.bz .ls-btn.dng{color:var(--rose)}
.bz .ls-btn[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ls-fbar{display:flex;align-items:center;gap:10px;padding:18px 32px 0;flex-wrap:wrap}
.ls-q{display:flex;align-items:center;gap:8px;height:32px;width:280px;padding:0 10px;border-radius:8px;background:var(--p1);border:1px solid var(--line);color:var(--ink3)}
.ls-q:focus-within{border-color:var(--ink3)}
.ls-q input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:inherit;color:var(--ink)}
.ls-q input::placeholder{color:var(--ink3)}
.ls-chips{display:flex;gap:6px;flex-wrap:wrap}
.bz .ls-chips button{height:28px;padding:0 11px;border-radius:999px;font-size:12px;color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.bz .ls-chips button:hover{border-color:var(--line2);color:var(--ink)}
.bz .ls-chips button[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ls-chips .n{font-family:'Geist Mono',monospace;font-size:11px;margin-left:5px;opacity:.65}
.ls-body{padding:22px 32px 48px}
.ls-pab{display:flex;align-items:center;gap:8px;padding:2px 12px 2px}
.ls-ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--ink2)}
.ls-pc{font-size:13px;color:var(--ink3)}

/* ---------- mřížky, sekce ---------- */
.ls-g1{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.ls-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ls-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ls-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ls-g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ls-sh{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.ls-sh:first-child{margin-top:0}
.ls-sh .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--ink2)}
.ls-sh .code{font-family:'Geist Mono',monospace;font-size:11.5px;font-weight:500;color:var(--ink2);padding:2px 7px;border-radius:6px;border:1px solid var(--line2)}
.ls-sh .n{font-family:'Geist Mono',monospace;font-weight:400;font-size:12px;color:var(--ink3)}
.ls-sh .ln{flex:1;height:1px;background:var(--line)}

/* ---------- karta: jeden fokusový cíl ---------- */
.ls-c{position:relative;min-width:0;background:var(--p1);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.ls-c:hover,.ls-c.hov{border-color:var(--line2);box-shadow:0 16px 32px -22px rgba(0,0,0,.75)}
.bz[data-theme=light] .ls-c:hover,.bz[data-theme=light] .ls-c.hov{box-shadow:0 16px 32px -22px rgba(20,22,26,.35)}
.ls-c.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ls-r{position:relative;list-style:none}
.ls-r:hover,.ls-r.hov{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
.ls-r.sel{background:color-mix(in srgb,var(--ink) 5%,transparent);box-shadow:inset 2px 0 0 var(--ink)}
.ls-cover{position:absolute;inset:0;border-radius:inherit;z-index:1}
.ls-cover:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ls-c a:not(.ls-cover),.ls-c button,.ls-r a:not(.ls-cover),.ls-r button{position:relative;z-index:2}
.ls-stt{position:absolute;top:-9px;right:12px;z-index:3;font:500 10px/1 'Geist Mono',monospace;padding:4px 6px;border-radius:5px;background:var(--sky);color:var(--on-status);pointer-events:none}
.ls-r .ls-stt{top:4px;right:auto;left:4px}
.ls-c h3{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.ls-lk{color:inherit;text-decoration:none;border-radius:5px}
.ls-lk:hover{color:var(--ink)}
.ls-lk:focus-visible,.ls-c a:focus-visible,.ls-r a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- drobné prvky ---------- */
.ls-av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;color:var(--av-ink);flex:none;letter-spacing:-.02em;line-height:1}
.ls-av.bot{border-radius:30%}
.ls-stack{display:inline-flex}
.ls-stack>.ls-av{box-shadow:0 0 0 2px var(--p1)}
.ls-stack>.ls-av+.ls-av{margin-left:-7px}
.ls-eng{display:inline-grid;place-items:center;padding:0 3px;border-radius:5px;font-family:'Geist Mono',monospace;font-weight:600;background:var(--p3);color:var(--ink);border:1px solid var(--line2);flex:none;line-height:1}
.ls-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--ink2);background:color-mix(in srgb,var(--ink) 5%,transparent);white-space:nowrap}
.ls-chip.mono{font-family:'Geist Mono',monospace;font-size:11px}
.ls-chip.ol{background:transparent;border:1px solid var(--line2)}
.ls-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--ink2);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.ls-pill .dot{width:6px;height:6px}
.ls-pill.working{color:var(--violet);background:color-mix(in srgb,var(--violet) 13%,transparent)}
.ls-pill.thinking{color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent)}
.ls-pill.parked{color:var(--amber-fg);background:var(--amb-s)}
.ls-pill.error{color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent)}
.ls-pill.done{color:var(--emerald);background:color-mix(in srgb,var(--emerald) 12%,transparent)}
.ls-bar{display:block;height:5px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.ls-bar i{display:block;height:100%;border-radius:99px;background:var(--ink2)}
.ls-bar.hot i{background:var(--amber)}
.ls-bar.over i{background:var(--rose)}
.bz .ls-sw{width:32px;height:20px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;flex:none;transition:background .15s}
.bz .ls-sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.bz .ls-sw[aria-checked=true]{background:var(--ink)}
.bz .ls-sw[aria-checked=true]::after{background:var(--p1);transform:translateX(12px)}
.bz .ls-sw.big{width:46px;height:26px}
.bz .ls-sw.big::after{width:22px;height:22px}
.bz .ls-sw.big[aria-checked=true]::after{transform:translateX(20px)}
.bz .ls-sw:disabled{opacity:.45;cursor:not-allowed}
.bz .ls-sw:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:'Geist Mono',monospace}

/* ---------- 1 · Firmy ---------- */
.co{padding:22px 22px 0;display:flex;flex-direction:column}
.co-h{display:flex;align-items:center;gap:14px}
.co-mono{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:-.04em;background:var(--ink);color:var(--on-ink);flex:none}
.co-t{flex:1;min-width:0}
.co h3{font-size:20px;letter-spacing:-.025em}
.co-t .mono{font-size:12px;color:var(--ink3)}
.co-ppl{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.co-d{margin:14px 0 0;color:var(--ink2);font-size:13.5px;line-height:1.55;max-width:560px;text-wrap:pretty}
.co-body{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:24px;align-items:center;margin-top:18px;padding:16px 0;border-top:1px solid var(--line)}
.co-root{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink3)}
.co-tree ul{list-style:none;margin:6px 0 0 6px;padding:0 0 0 16px;border-left:1px solid var(--line2)}
.co-tree li{position:relative;display:flex;align-items:center;gap:12px;padding:5px 0}
.co-tree li::before{content:'';position:absolute;left:-16px;top:50%;width:11px;height:1px;background:var(--line2)}
.co-tm{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);min-width:130px}
.co-pj{display:inline-flex;align-items:center;gap:4px;color:var(--ink3);font-size:11.5px}
.co-pj i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink3)}
.co-pj .mono{margin-left:4px}
.co-g{display:flex;flex-direction:column;align-items:center;gap:2px}
.co-g small{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.co-f{display:flex;align-items:center;gap:8px;padding:12px 0 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3)}
.co-f b{color:var(--ink);font-weight:500}

/* ---------- 2 · Týmy ---------- */
.tm{padding:18px;display:flex;flex-direction:column;gap:14px}
.tm-crumb{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;color:var(--ink2);align-self:flex-start}
.tm-n{display:flex;align-items:baseline;gap:8px}
.tm-n .mono{font-size:11.5px;color:var(--ink3)}
.tm-d{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.tm-people{display:flex;align-items:center;gap:5px}
.tm-more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink2);border:1px dashed var(--line2)}
.tm-cnt{margin-left:auto;font-size:12px;color:var(--ink3)}
.tm-kb{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3%,transparent);border:1px solid var(--line)}
.tm-kb .bk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line2);color:var(--ink)}
.tm-kb b{display:block;font-weight:500;font-size:12.5px}
.tm-kb small{display:block;color:var(--ink3);font-size:11.5px}
.tm-spark{display:flex;align-items:flex-end;gap:2px;height:22px}
.tm-spark i{width:4px;border-radius:1.5px;background:var(--ink3)}

/* ---------- 3 · Projekty ---------- */
.pj{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.pj-h{display:flex;align-items:flex-start;gap:10px}
.pj-h .tt{flex:1;min-width:0}
.pj-path{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.pj-live{display:flex;gap:10px;font-size:11.5px;font-weight:500;margin-top:5px}
.pj-live span{display:inline-flex;align-items:center;gap:5px}
.pj-live .v{color:var(--violet)}
.pj-live .a{color:var(--amber-fg)}
.pj-strip{display:flex;height:8px;border-radius:3px;overflow:hidden;gap:2px}
.pj-strip i{display:block;height:100%}
.pj-c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 4px;margin:-4px -6px 0}
.pj-c a{display:flex;align-items:center;justify-content:space-between;gap:6px;height:26px;padding:0 6px;border-radius:7px;text-decoration:none;color:var(--ink2);font-size:11.5px}
.pj-c a:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
.pj-c a span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.pj-c b{font-family:'Geist Mono',monospace;font-weight:500;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.pj-c a.z b{color:var(--ink3);font-weight:400}
.pj-c .sq{width:7px;height:7px;border-radius:2px;flex:none}
.pj-sp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.pj-sp b{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink);font-weight:500;white-space:nowrap}
.pj-bud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pj-bud>div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--ink3)}
.pj-bud .l{display:flex;justify-content:space-between}
.pj-bud .l .mono{color:var(--ink2)}
.pj-bud .hot .l .mono{color:var(--amber-fg)}
.pj-bud .over .l .mono{color:var(--rose)}
.pj-emp{display:flex;align-items:center;gap:12px;padding:18px;border:1px dashed var(--line2);border-radius:12px;color:var(--ink3);font-size:13px}

/* ---------- 4 · Agenti ---------- */
.ag{display:flex;flex-direction:column;overflow:hidden}
.ag-top{position:relative;height:96px;background:linear-gradient(180deg,color-mix(in srgb,var(--hue) 20%,transparent),color-mix(in srgb,var(--hue) 4%,transparent));border-bottom:1px solid var(--line);border-radius:11px 11px 0 0}
.ag-st{position:absolute;top:10px;left:10px}
.ag-dep{position:absolute;top:12px;right:12px;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--ink3)}
.ag-av{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%)}
.ag-av>.ls-av{box-shadow:0 0 0 4px var(--p1)}
.ag-eb{position:absolute;right:-8px;bottom:-2px}
.ag-eb .ls-eng{box-shadow:0 0 0 3px var(--p1)}
.ag-b{padding:48px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ag-b h3{font-size:16px}
.ag-b p{font-size:12.5px;color:var(--ink3);margin-top:2px}
.ag-now{font-size:12px;color:var(--violet);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-now.thinking{color:var(--sky)}
.ag-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ag-think{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.ag-think i{width:3px;border-radius:1px;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.ag-think i.on{background:var(--ink2)}
.ag-tools{display:flex;gap:4px}
.ag-tools span{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink2)}
.ag-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:auto}
.ag-stats div{padding:9px 6px;text-align:center;font-size:10.5px;color:var(--ink3)}
.ag-stats div+div{border-left:1px solid var(--line)}
.ag-stats b{display:block;font-family:'Geist Mono',monospace;font-size:13px;color:var(--ink);font-weight:500}

/* ---------- 5 · Workflow ---------- */
.wf{display:grid;grid-template-columns:300px minmax(0,1fr)}
.wf-l{padding:18px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line)}
.wf-l .hd{display:flex;align-items:center;gap:10px}
.wf-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line2);color:var(--ink);flex:none}
.wf-l p{font-size:12.5px;color:var(--ink2);line-height:1.5;text-wrap:pretty}
.wf-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.wf-last{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.wf-last .mono{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.wf-r{padding:20px 22px;display:flex;align-items:center;overflow-x:auto;background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1px,transparent 1.2px);background-size:16px 16px;border-radius:0 11px 11px 0}
.wf-pipe{display:flex;align-items:center;min-width:max-content}
.wf-n{display:flex;flex-direction:column;gap:7px;width:150px;padding:10px 11px;border-radius:10px;background:var(--p1);border:1px solid var(--line2)}
.wf-n .no{display:flex;align-items:center;gap:6px;font-family:'Geist Mono',monospace;font-size:10px;color:var(--ink3)}
.wf-n .ok{color:var(--emerald);display:inline-flex}
.wf-n .no .dot{width:7px;height:7px}
.wf-ph{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-n .r1{display:flex;align-items:center;gap:6px;min-width:0}
.wf-who{flex:1;min-width:0;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-n.done{background:color-mix(in srgb,var(--p1) 70%,transparent)}
.wf-n.act{border-color:color-mix(in srgb,var(--violet) 65%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 14%,transparent)}
.wf-a{width:30px;height:2px;background:var(--line2);position:relative;flex:none;margin-right:6px}
.wf-a::after{content:'';position:absolute;right:-6px;top:-4px;border:5px solid transparent;border-left:6px solid var(--line2);border-right:0}
.wf-a.done{background:var(--ink3)}
.wf-a.done::after{border-left-color:var(--ink3)}
.wf-out{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px dashed var(--line2);background:var(--p1);font-size:12px;color:var(--ink2);white-space:nowrap}

/* ---------- 6 · Automatizace ---------- */
.au-note{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--amber) 6%,transparent);border:1px solid color-mix(in srgb,var(--amber) 24%,transparent);font-size:13px;color:var(--ink2);margin-bottom:24px}
.au-note .sh{color:var(--amber-fg);display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--amb-s);flex:none}
.au-note b{color:var(--ink);font-weight:500}
.au-note a{margin-left:auto;color:var(--amber-fg);font-weight:500;text-decoration:none;white-space:nowrap;border-radius:5px}
.au{padding:16px;display:flex;flex-direction:column;gap:14px}
.au-h{display:flex;align-items:center;gap:10px}
.au-h h3{flex:1;min-width:0}
.au-onl{font-size:12px;color:var(--ink3)}
.au-dia{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);align-items:stretch;transition:opacity .2s}
.au-t{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);min-width:0}
.au-t .i{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--ink);flex:none}
.au-t .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:1px}
.au-t b{display:block;font-weight:500;font-size:13px;line-height:1.3}
.au-t code{display:block;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-ar{position:relative}
.au-ar::before{content:'';position:absolute;left:4px;right:10px;top:calc(50% - 1px);height:2px;background:var(--ink2)}
.au-ar::after{content:'';position:absolute;right:4px;top:calc(50% - 5px);border:5px solid transparent;border-left:7px solid var(--ink2);border-right:0}
.au.off .au-ar::before{background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
.au.off .au-ar::after{border-left-color:var(--line2)}
.au.off .au-dia,.au.off .au-tl{opacity:.55}
.au-tl{position:relative;height:34px;margin:0 6px}
.au-tl .ax{position:absolute;left:0;right:0;top:7px;height:2px;border-radius:2px;background:var(--line2)}
.au-tl .past{position:absolute;left:0;top:7px;height:2px;border-radius:2px;background:var(--ink3)}
.au-tl .now{position:absolute;top:1px;width:2px;height:14px;margin-left:-1px;background:var(--ink);border-radius:2px}
.au-tl .mk{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;box-shadow:0 0 0 2px var(--p1)}
.au-tl .mk.nx{background:var(--p1);border:2px solid var(--ink2)}
.au-tl .fr{position:absolute;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink2);box-shadow:0 0 0 2px var(--p1)}
.au-tl .lb{position:absolute;top:19px;font-size:11px;color:var(--ink3);white-space:nowrap}
.au-tl .lb.r{right:0}
.au-tl .lb.n{transform:translateX(-50%);color:var(--ink2);font-weight:500}
.au-f{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.au-f .st{display:inline-flex;align-items:center;gap:7px}
.rg-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--p1);overflow:hidden}
.rg-list>.ls-r+.ls-r{border-top:1px solid var(--line)}
.au-r{display:grid;grid-template-columns:10px minmax(0,1fr) 220px 150px 34px;gap:14px;align-items:center;padding:11px 16px;font-size:13px}
.au-r b{font-weight:500}
.au-r .mono{font-size:11.5px;color:var(--ink3)}
.au-r .w{color:var(--ink2);font-size:12.5px}

/* ---------- 7 · Cíle ---------- */
.go{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;padding:18px}
.go-ring{position:relative;width:132px;height:132px}
.go-ring svg{display:block;width:100%;height:100%}
.go-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.go-ring b{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.go-ring small{font-size:11px;color:var(--ink3);margin-top:4px}
.go-cur{animation:lscur 1.6s ease-in-out infinite}
@keyframes lscur{50%{opacity:.4}}
.go-r{display:flex;flex-direction:column;gap:10px;min-width:0}
.go-top{display:flex;align-items:center;gap:8px}
.go-top .mono{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.go-pair{display:flex;align-items:center;gap:10px;font-size:12.5px}
.go-pair .p{display:flex;align-items:center;gap:7px;min-width:0}
.go-pair .p small{display:block;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;line-height:1.2}
.go-pair .x{color:var(--ink3);font-size:16px}
.go-v{padding:9px 11px;border-radius:9px;background:color-mix(in srgb,var(--ink) 3%,transparent);border-left:2px solid var(--line2);font-size:12.5px;color:var(--ink2);line-height:1.45;text-wrap:pretty}
.go-v .k{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink3);margin-bottom:3px}
.go-v .k b{font-weight:500;color:var(--ink2)}
.go-v.parked{border-left-color:var(--amber)}
.go-v.parked .k b{color:var(--amber-fg)}
.go-v.error{border-left-color:var(--rose)}
.go-v.error .k b{color:var(--rose)}
.go-v.done{border-left-color:var(--emerald)}
.go-v.done .k b{color:var(--emerald)}
.go-acts{display:flex;gap:6px;margin-top:auto}

/* ---------- 8 · Oddělení ---------- */
.dp-org{display:flex;flex-direction:column;align-items:center}
.dp-root{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:999px;background:var(--p1);border:1px solid var(--line2);font-size:13px;font-weight:500}
.dp-root .m{width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:10px;font-weight:700}
.dp-stem{width:1px;height:16px;background:var(--line2)}
.dp-rail{position:relative;width:calc((200% + 32px) / 3);height:18px;border:1px solid var(--line2);border-bottom:0;border-radius:8px 8px 0 0}
.dp-rail::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.dp{display:flex;flex-direction:column}
.dp-h{display:flex;gap:12px;padding:16px 16px 0;align-items:flex-start}
.dp-code{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;font-family:'Geist Mono',monospace;font-weight:600;font-size:15px;border:1px solid var(--line2);background:var(--p2);flex:none}
.dp-lead{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-top:5px}
.dp-man{font-size:12.5px;color:var(--ink2);line-height:1.5;padding:12px 16px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:49px}
.dp-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:14px 16px 0;border:1px solid var(--line);border-radius:10px}
.dp-kpi>div{padding:9px 10px;min-width:0}
.dp-kpi>div+div{border-left:1px solid var(--line)}
.dp-kpi b{display:block;font-size:20px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.dp-kpi small{font-size:10.5px;color:var(--ink3);line-height:1.25;display:block;margin-top:3px}
.dp-kpi .a small i{font-style:normal;color:var(--amber-fg);display:block}
.dp-tabs{display:flex;flex-wrap:wrap;gap:2px 12px;padding:12px 16px 14px;margin-top:14px;border-top:1px solid var(--line);font-size:12px}
.dp-tabs a{color:var(--ink3);text-decoration:none}
.dp-tabs a:hover{color:var(--ink)}

/* ---------- 9 · Registry ---------- */
.rg-sub{display:flex;align-items:center;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.bz .rg-sub button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;font-size:13px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0}
.bz .rg-sub button:hover{color:var(--ink)}
.bz .rg-sub button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.rg-sub .n{font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.sk{padding:11px 12px;display:flex;flex-direction:column;gap:8px;border-radius:10px}
.sk-h{display:flex;align-items:center;gap:9px;min-width:0}
.sk-gl{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:'Geist Mono',monospace;font-size:10px;font-weight:600;background:var(--p2);border:1px solid var(--line);color:var(--ink2);flex:none}
.sk-h b{font-family:'Geist Mono',monospace;font-size:12.5px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-src{font-size:10.5px;color:var(--ink3);padding:1px 6px;border:1px solid var(--line);border-radius:5px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.sk p{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-b{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink3);padding-top:7px;border-top:1px solid var(--line);flex-wrap:wrap}
.sk-b code{font-family:'Geist Mono',monospace;font-size:10px;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink2)}
.sk-b .no{font-style:italic}
.cm{border:1px solid var(--line);border-radius:12px;background:var(--p1);overflow:hidden}
.cm-bar{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-bottom:1px solid var(--line);font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3);background:var(--code-bg)}
.cm-bar i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.cm-list{list-style:none;margin:0;padding:0}
.cm-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:11px 16px}
.cm-list>.ls-r+.ls-r{border-top:1px dashed var(--line2)}
.cm-l{font-family:'Geist Mono',monospace;font-size:13.5px;display:flex;gap:10px;align-items:baseline;min-width:0;flex-wrap:wrap}
.cm-l .pr{color:var(--ink3)}
.cm-l .nm{color:var(--ink);font-weight:500}
.cm-l .arg{color:var(--syn-k)}
.cm-d{flex-basis:100%;font-family:'Geist',system-ui,sans-serif;font-size:12px;color:var(--ink3);padding-left:20px}
.cm-p{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.cm-p.auto{background:var(--ink);color:var(--on-ink)}
.cm-p.man{border:1px solid var(--line2);color:var(--ink3);font-weight:400}
.hk{display:grid;grid-template-columns:210px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 16px}
.hk-ev{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--line2);font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink);justify-self:start;background:var(--bg)}
.hk-ev svg{color:var(--ink3)}
.hk-ar{color:var(--ink3);display:grid;place-items:center}
.hk-cmd{font-family:'Geist Mono',monospace;font-size:12px;padding:6px 10px;border-radius:7px;background:var(--code-bg);border:1px solid var(--line);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk-m{display:flex;flex-direction:column;align-items:flex-end;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.mc{display:grid;grid-template-columns:38px minmax(0,1fr) 64px minmax(0,1.4fr) 90px 34px;gap:14px;align-items:center;padding:12px 16px}
.mc-s{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);position:relative;color:var(--ink2)}
.mc-s .dot{position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;box-shadow:0 0 0 2.5px var(--p1)}
.mc-s .dot.live{animation:lsping 2.4s ease-out infinite}
@keyframes lsping{0%{box-shadow:0 0 0 2.5px var(--p1),0 0 0 2.5px color-mix(in srgb,var(--emerald) 55%,transparent)}100%{box-shadow:0 0 0 2.5px var(--p1),0 0 0 9px transparent}}
.mc-n b{display:block;font-weight:500;font-size:13.5px}
.mc-n small{display:block;font-size:11.5px;color:var(--ink3)}
.mc-n small.on{color:var(--emerald)}
.mc-n small.err{color:var(--rose)}
.mc-tr{font-family:'Geist Mono',monospace;font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--ink2);justify-self:start}
.mc-u{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-t{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink3)}

/* ---------- 10 · Marketplace ---------- */
.mk{display:flex;flex-direction:column}
.mk-shelf{display:flex;align-items:flex-end;gap:6px;height:88px;padding:0 16px 10px;border-bottom:2px solid var(--line2);background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--ink) 3.5%,transparent));border-radius:11px 11px 0 0}
.mk-shelf span{width:32px;border-radius:7px;display:grid;place-items:center;font-family:'Geist Mono',monospace;font-size:9.5px;font-weight:600}
.mk-shelf .in{background:var(--p3);border:1px solid var(--line2);color:var(--ink)}
.mk-shelf .out{border:1px dashed var(--line2);color:var(--ink3)}
.mk-shelf .more{width:auto;font-size:11px;color:var(--ink3);margin-left:4px;align-self:center;font-weight:400}
.mk-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mk-h{display:flex;align-items:center;gap:8px}
.mk-h h3{flex:1;font-family:'Geist Mono',monospace;font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-tag{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:500}
.mk-tag.dev{border:1px dashed var(--ink3);color:var(--ink)}
.mk-tag.reg{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink2)}
.mk-src{display:inline-flex;align-items:center;gap:6px;font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink3);align-self:flex-start;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mk-p .l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px}
.mk-p .l b{font-weight:600;color:var(--ink)}
.mk-p .mono{color:var(--ink3);font-size:11.5px}
.mk-f{display:flex;align-items:center;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);margin-top:auto}

/* ---------- prázdno a načítání ---------- */
.ls-sk{display:block;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent);position:relative;overflow:hidden;flex:none}
.ls-sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 8%,transparent),transparent);animation:lssh 1.4s ease-in-out infinite}
@keyframes lssh{to{transform:translateX(100%)}}
.ls-skc{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.ls-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:44px 24px 56px;border:1px dashed var(--line2);border-radius:16px}
.ls-ghost{display:grid;gap:10px;width:min(560px,100%);margin-bottom:10px}
.ls-ghost>div{border:1.5px dashed var(--line2);border-radius:10px}
.ls-eic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line2);color:var(--ink)}
.ls-empty h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.ls-empty p{font-size:13.5px;color:var(--ink2);max-width:460px;line-height:1.55;text-wrap:pretty}
.ls-empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}

/* ---------- přehled rodiny ---------- */
.ov{width:1440px;max-width:calc(100% - 40px);margin:30px auto 80px}
.ov h2.h{font-size:30px;font-weight:500;letter-spacing:-.035em}
.ov .lead2{color:var(--ink2);font-size:14.5px;max-width:860px;margin:8px 0 24px;line-height:1.6;text-wrap:pretty}
.ov-rule{display:grid;grid-template-columns:380px minmax(0,1fr);gap:36px;padding:24px;border:1px solid var(--line2);border-radius:16px;background:var(--p1);margin-bottom:32px}
.ov-rule h3{font-size:15px;font-weight:600;margin-bottom:10px}
.ov-rule ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;line-height:1.7}
.ov-rule li b{color:var(--ink);font-weight:500}
.ov table{width:100%;border-collapse:collapse;font-size:12.5px}
.ov th{text-align:left;font-weight:500;color:var(--ink3);padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.ov td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.ov td:first-child{color:var(--ink);font-weight:500;white-space:nowrap}
.ov-bar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.ov-bar h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.ov-bar span{color:var(--ink3);font-size:13px}
.ov-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.ov-t{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--p1)}
.ov-th{height:300px;overflow:hidden;position:relative;background:var(--bg);border-bottom:1px solid var(--line)}
.ov-th>.sc{width:1440px;transform:scale(.32);transform-origin:0 0;pointer-events:none;transition:filter .3s}
.ov.sil .ov-th>.sc{filter:grayscale(1) blur(3px)}
.ov-tf{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ov-tf b{font-weight:600}
.ov-tf small{display:block;color:var(--ink3);font-size:12px}

/* ---------- telefon ---------- */
.vw-ph .ls-head{padding:4px 16px 0}
.vw-ph .ls-head h1{font-size:30px}
.vw-ph .ls-fbar{padding:12px 16px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.vw-ph .ls-q{display:none}
.vw-ph .ls-chips{flex-wrap:nowrap}
.vw-ph .ls-body{padding:14px 12px 40px}
.vw-ph .ls-g2,.vw-ph .ls-g3,.vw-ph .ls-g4{grid-template-columns:minmax(0,1fr);gap:12px}

        h('div', null, h('h3', null, 'Už odlišné — jen lehký restyle'), h('p', { style: { color: 'var(--ink2)', fontSize: 13, lineHeight: 1.6 } }, 'Tyhle stránky mají vlastní tvar a neměníme ho. Dostanou jen společný rám stránky a tokeny, aby patřily do stejné rodiny.')),
        h('table', null, h('thead', null, h('tr', null, h('th', null, 'Stránka'), h('th', null, 'Zůstává'), h('th', null, 'Sjednotit'))),
          h('tbody', null, [
            ['Běhy', 'Tabulka, filtry v URL, nekonečný scroll', 'Rám, stavové tečky z rodiny, čísla mono'],
            ['Schvalování', 'Fronta ApprovalCard + historie', 'Jantar jen pro čekající, karta = jeden fokusový cíl'],
            ['Pull requesty', 'Tabulka se stacky, CI, review', 'Kolejnice stacků z Můstku, čipy ok/warn/err'],
            ['Inbox', 'Issues po epicích, PR master–detail', 'Hover a výběr řádků jako .ls-r'],
            ['Pravidla', 'Kanban ask / deny / notify / allow', 'Hlavičky sloupců jako sekce rodiny'],
            ['Rozpočty a Útrata', 'Metry a okna 5 h / týden', 'Stejné rozpočtové pruhy jako Projekty (jantar ≥ 80 %, růžová ≥ 100 %)'],
            ['Vault, Briefingy', 'Tři panely, dokument z panelů', 'Jen rám a typová škála']
          ].map(r => h('tr', null, r.map(c => h('td', null, c))))))));
  }

  renderVals() {
    const v = this.view(), m = this.state.mode, d = this.state.dev;
    return {
      views: ['overview'].concat(this.PAGES).map(k => ({ label: this.LBL[k], on: v === k, pick: () => this.setState({ view: k }) })),
      modes: [['full', 'Naplněno'], ['empty', 'Prázdné'], ['load', 'Načítání'], ['hover', 'Hover · výběr']].map(x => ({ label: x[1], on: m === x[0], pick: () => this.setState({ mode: x[0] }) })),
      devs: [['both', 'Obojí'], ['desk', 'Desktop'], ['phone', 'Telefon']].map(x => ({ label: x[1], on: d === x[0], pick: () => this.setState({ dev: x[0] }) })),
      themes: [['dark', 'Tmavé'], ['light', 'Světlé']].map(x => ({ label: x[1], on: this.theme() === x[0], pick: () => this.setTheme(x[0]) })),
      theme: this.theme(),
      isPage: v !== 'overview',
      page: v === 'overview' ? this.overview() : this.showPage(v)
    };
  }
}
</script>
