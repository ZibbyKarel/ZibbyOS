<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZibbyOS — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<style>
/* ---- chrome (same rules as Top Chrome) ---- */
.tc-h{position:relative;z-index:40;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;background:var(--p1);border-bottom:1px solid var(--line);flex:none}
.tc-zw{display:flex;align-items:center;gap:10px;flex:none}
.tc-z{gap:6px}
.tc-brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;border-radius:8px;padding:4px 4px 4px 2px;flex:none}
.tc-brand:focus-visible,.tc-sec a:focus-visible,.tc-crumbs a:focus-visible,.st-rail a:focus-visible,.st-anc a:focus-visible,.st-lk:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tc-wm{font-weight:600;letter-spacing:-.03em;font-size:14.5px}
.tc-sec{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
.tc-sec a{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 8px;border-radius:7px;color:var(--ink3);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.tc-sec a.io{padding:0;width:30px;justify-content:center}
.tc-sec a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tc-sec a .att{position:absolute;top:4px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--p1)}
.tc-sp{flex:1;min-width:8px}
.tc-div{width:1px;height:22px;background:var(--line2);flex:none;margin:0 4px}
.tc-cmd{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:12.5px;white-space:nowrap}
.tc-cmd:hover{color:var(--ink);border-color:var(--ink3)}
.tc-new{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.tc-new.io{width:30px;padding:0;justify-content:center}
.tc-new .cv{opacity:.55;margin-left:-1px}
.tc-zib{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1px solid var(--line2);color:var(--ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.tc-zib:hover{background:var(--p2)}
.tc-orb{position:relative;display:inline-block;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--sky) 85%,#fff) 0%,var(--violet) 72%);box-shadow:0 0 0 1px color-mix(in srgb,var(--violet) 30%,transparent)}
.tc-stat{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 7px 0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.tc-stat .n{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink)}
.tc-stat .rings{display:inline-flex;gap:3px;padding-left:7px;border-left:1px solid var(--line)}
.tc-upd{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:color-mix(in srgb,var(--sky) 15%,transparent);color:var(--sky)}
.tc-mode{display:inline-flex;align-items:stretch;height:30px;border-radius:8px;border:1px solid var(--line2)}
.tc-mode>button{display:inline-flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tc-mode>button+button{border-left:1px solid var(--line2)}
.tc-eng{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-family:'Geist Mono',monospace;font-size:9px;font-weight:600;background:var(--p3);color:var(--ink);border:1px solid var(--line2);flex:none}
.tc-ib{position:relative;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
.bz .tc-ib{text-align:center}
.tc-ib:hover{background:var(--p2);color:var(--ink)}
.tc-ib.on{background:var(--p3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.tc-bell b{position:absolute;top:2px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:9.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--p1)}
.tc-anc{position:relative;display:inline-flex}
.tc-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:45;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;font-size:12.5px;color:var(--ink);white-space:normal}
.tc-mi{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 8px;border-radius:7px;color:var(--ink);text-decoration:none}
.tc-mi:hover,.tc-mi.hl{background:var(--p2)}
.tc-mi .ico{color:var(--ink3);display:inline-flex}
.tc-mi .k{margin-left:auto}
.tc-mi small{margin-left:auto;color:var(--ink3);font-size:11.5px}
.tc-sep{height:1px;background:var(--line);margin:6px -6px}
.tc-ph{padding:8px 8px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tc-mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px;font-size:12.5px;color:var(--ink2)}
.tc-mfoot{padding:6px 8px 4px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--ink3)}
.tc-scrim{position:absolute;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(2px)}
.tc-pal{position:absolute;z-index:51;top:76px;left:50%;transform:translateX(-50%);width:620px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden}
.tc-pal-in{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--ink3)}
.tc-pal-in input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;font-size:15px}
.tc-pal-g{padding:6px}
.tc-pal-z{display:flex;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.tc-ctx{position:relative;z-index:10;display:flex;align-items:center;height:42px;padding:0 14px;border-bottom:1px solid var(--line);gap:4px;flex:none}
.tc-crumbs{display:flex;align-items:center;font-size:13px;color:var(--ink3);padding-left:6px}
.tc-crumbs ol{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0}
.tc-crumbs li{display:flex;align-items:center;gap:2px}
.tc-crumbs a{display:inline-flex;align-items:center;gap:5px;color:var(--ink3);text-decoration:none;padding:3px 5px;border-radius:5px;white-space:nowrap}
.tc-crumbs a:hover{color:var(--ink);background:var(--p2)}
.tc-crumbs [aria-current=page]{color:var(--ink);font-weight:500;padding:3px 5px}
.tc-crumbs .sl{color:var(--ink3);opacity:.6}
.tc-mbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 6px;background:var(--p1);border-bottom:1px solid var(--line);position:relative;z-index:5;flex:none}
.tc-mtitle{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.tc-node{transform-box:fill-box;transform-origin:center}
.tc-node.working{animation:tcpulse 1.3s ease-in-out infinite}
.tc-node.needs{animation:tcpulse 1.9s ease-in-out infinite}
@keyframes tcpulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ---- settings grammar ---- */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.st-wrap{width:1440px;max-width:calc(100% - 40px);margin:0 auto}
.st-stage{position:relative;margin:14px auto 56px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.st-scroll{flex:1;min-height:0;overflow-y:auto;position:relative}
.st-body{display:grid;grid-template-columns:216px minmax(0,1fr) 168px;gap:40px;padding:28px 28px 0;align-items:start;max-width:1340px;margin:0 auto}
.st-body.na{grid-template-columns:216px minmax(0,780px) 168px}
.st-body.nar{grid-template-columns:192px minmax(0,1fr);gap:28px;padding:24px 24px 0}
.st-rail{position:sticky;top:28px;display:flex;flex-direction:column;gap:2px}
.st-rail .hd{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:2px 10px 8px}
.st-rail a{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:13px;line-height:1.3}
.st-rail a:hover{background:var(--p2);color:var(--ink)}
.st-rail a[aria-current=page]{background:var(--p2);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line2)}
.st-rail a .ico{color:var(--ink3);display:inline-flex}
.st-rail a[aria-current=page] .ico{color:var(--ink)}
.st-rail a .tail{margin-left:auto;display:inline-flex}
.st-rail .ad{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 18%,transparent)}
.st-rail .uv{font-family:'Geist Mono';font-size:10.5px;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--sky) 15%,transparent);color:var(--sky)}
.st-rail .ft{margin-top:14px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.6}
.st-anc{position:sticky;top:28px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.st-anc .hd{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:2px 12px 8px}
.st-anc a{display:flex;align-items:center;gap:6px;padding:5px 12px;margin-left:-1px;border-left:1px solid transparent;font-size:12.5px;color:var(--ink3);text-decoration:none;line-height:1.35}
.st-anc a:hover{color:var(--ink)}
.st-anc a[aria-current=location]{color:var(--ink);border-left-color:var(--ink);font-weight:500}
.st-anc .dd,.st-save .dd{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
.st-anc .wd{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.st-main{min-width:0;display:flex;flex-direction:column;gap:16px;padding-bottom:48px}
.st-hd{padding:0 2px 4px}
.st-hd .eb{font-size:12px;color:var(--ink3);margin-bottom:6px}
.st-hd h1{font-size:24px;font-weight:600;letter-spacing:-.025em;color:var(--ink);line-height:1.2}
.st-hd p{font-size:14px;color:var(--ink2);margin-top:5px;text-wrap:pretty}
.st-pnl{border:1px solid var(--line);border-radius:12px;background:var(--p1);scroll-margin-top:20px;transition:border-color .2s,box-shadow .2s}
.st-pnl.dirty{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.st-pnl.err{border-color:color-mix(in srgb,var(--rose) 50%,transparent)}
.st-pnl.ns{background:transparent;border-style:dashed;border-color:var(--line2)}
.st-pnl.att{border-color:color-mix(in srgb,var(--amber) 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 14%,transparent)}
.st-pnl.off>.st-row,.st-pnl.off>.st-cards,.st-pnl.off>.st-grid2{opacity:.5}
.st-phd{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px}
.st-phd .tt{flex:1;min-width:0}
.st-phd h2{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink);line-height:1.35}
.st-phd p{font-size:12.5px;color:var(--ink3);margin-top:3px;text-wrap:pretty;max-width:62ch}
.st-pa{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.st-pa .st{font-size:12px;color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
.st-tog{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px 12px;border-radius:12px}
.st-tog:hover{background:color-mix(in srgb,var(--ink) 2%,transparent)}
.st-tog .cv{color:var(--ink3);margin-top:1px;transition:transform .2s}
.st-tog[aria-expanded=true] .cv{transform:rotate(180deg)}
.st-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:12px 16px;border-top:1px solid var(--line)}
.st-row .lb{flex:1 1 250px;min-width:0}
.st-row .l{font-size:13px;font-weight:500;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st-row .lb small{display:block;font-size:12px;color:var(--ink3);margin-top:2px;text-wrap:pretty;max-width:56ch;line-height:1.45}
.st-row .ct{flex:0 1 auto;display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.st-row.stack .ct{flex:1 1 100%;margin-left:0;justify-content:flex-start}
.st-row.dis{opacity:.5}
.st-row .was{font-size:11.5px;font-weight:400;color:var(--ink3);font-family:'Geist Mono'}
.st-row.chg .l::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink)}
.st-in{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;outline:none;min-width:0}
.st-in::placeholder{color:var(--ink3)}
.st-in:focus{border-color:var(--ink2);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.st-in.mono{font-family:'Geist Mono',monospace;font-size:12.5px}
.st-in.chg{border-color:color-mix(in srgb,var(--ink) 55%,transparent)}
.st-in[aria-invalid=true]{border-color:var(--rose)}
.st-in:disabled{opacity:.5}
.st-in[type=number]{width:68px;text-align:right;font-family:'Geist Mono';font-variant-numeric:tabular-nums}
.st-fld{display:inline-flex;align-items:center;position:relative;min-width:0}
.st-fld .st-in{padding-right:34px;width:100%}
.st-fld .tc-ib{position:absolute;right:2px;width:28px;height:28px}
.st-sw{width:34px;height:20px;border-radius:99px;background:color-mix(in srgb,var(--ink) 20%,transparent);position:relative;flex:none;transition:background .15s}
.st-sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.st-sw[aria-checked=true]{background:var(--ink)}
.st-sw[aria-checked=true]::after{transform:translateX(14px);background:var(--on-ink)}
.st-sw:disabled{opacity:.45;cursor:not-allowed}
.bz .st-sw:focus-visible{border-radius:99px}
.st-seg{padding:3px}
.st-seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.st-seg button:hover{color:var(--ink)}
.st-seg button[aria-checked=true]{background:var(--p3);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line2)}
.bz[data-theme=light] .st-seg button[aria-checked=true]{background:var(--p1);box-shadow:0 1px 2px rgba(20,22,26,.08),0 0 0 1px var(--line2)}
.st-seg.sm button{height:22px;padding:0 8px;font-size:12px}
.st-seg button:disabled{opacity:.45;cursor:not-allowed}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ink:hover{background:color-mix(in srgb,var(--ink) 84%,var(--bg))}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--rose) 10%,transparent)}
.btn.dangerf{background:var(--rose);border-color:var(--rose);color:var(--on-status)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:inherit}
.btn.ink:disabled:hover{background:var(--ink)}
.st-spin{display:inline-flex}
.st-spin svg{animation:spin 1s linear infinite}
.bdg{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap;letter-spacing:0}
.bdg::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-sizing:border-box;flex:none}
.bdg.ok{color:var(--emerald);background:color-mix(in srgb,var(--emerald) 11%,transparent)}
.bdg.wait{color:var(--amber-fg);background:var(--amb-s)}
.bdg.off{color:var(--ink2);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.bdg.off::before{background:transparent;border:1.5px solid currentColor}
.bdg.err{color:var(--rose);background:color-mix(in srgb,var(--rose) 11%,transparent)}
.bdg.info{color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent)}
.bdg.nd::before{display:none}
.st-note{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;margin:0 16px 14px;padding:10px 12px;border-radius:9px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.st-note>.i{margin-top:1px;display:inline-flex}
.st-note b{color:var(--ink);font-weight:500}
.st-note .ac{display:flex;gap:6px;align-items:center;align-self:center;flex-wrap:wrap;justify-content:flex-end}
.st-note.info{background:color-mix(in srgb,var(--ink) 3%,transparent);border:1px solid var(--line)}
.st-note.info>.i{color:var(--ink3)}
.st-note.wait{background:color-mix(in srgb,var(--amber) 7%,transparent);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.st-note.wait>.i{color:var(--amber-fg)}
.st-note.err{background:color-mix(in srgb,var(--rose) 7%,transparent);border:1px solid color-mix(in srgb,var(--rose) 32%,transparent)}
.st-note.err>.i{color:var(--rose)}
.st-note.sky{background:color-mix(in srgb,var(--sky) 7%,transparent);border:1px solid color-mix(in srgb,var(--sky) 30%,transparent)}
.st-note.sky>.i{color:var(--sky)}
.st-note.top{margin:0}
.st-row+.st-note,.st-cards+.st-note,.st-grid2+.st-note,.st-mxw+.st-note{margin-top:2px}
.st-code{font-family:'Geist Mono',monospace;font-size:12px;color:var(--ink);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.st-val{font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--ink);white-space:nowrap}
.st-dim{color:var(--ink3);font-size:12px}
.st-lk{color:var(--ink2);font-size:12.5px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.st-lk:hover{color:var(--ink);text-decoration-color:var(--ink3)}
.st-keys{display:inline-flex;gap:4px;align-items:center}
.st-key{min-width:28px;height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);border-bottom-width:2px;background:var(--p2);font-family:'Geist Mono',monospace;font-size:12.5px;display:inline-grid;place-items:center;color:var(--ink)}
.st-recbox{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px dashed var(--ink2);color:var(--ink);font-size:12.5px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.st-recbox i{width:8px;height:8px;border-radius:50%;background:var(--rose);animation:tcpulse 1s ease-in-out infinite}
.st-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:2px 16px 16px}
.st-cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-card{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);min-width:0}
.st-card:hover{border-color:var(--ink3)}
.st-card[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.st-card:disabled{opacity:.5;cursor:not-allowed}
.st-card .t{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.st-card .d{font-size:12px;color:var(--ink2);line-height:1.45;text-wrap:pretty}
.st-card .q{font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:8px;margin-top:auto;font-style:italic;line-height:1.45}

      h('p', null, t('Also update the Top Chrome IA: Settings now lists five pages (add Access & notifications) and General no longer carries the token.', 'Uprav také IA v Top Chrome: Nastavení má teď pět stránek (přidat Přístup a oznámení) a Obecné už nenese token.')),
      h('h2', null, t('Accessibility', 'Přístupnost')), table([t('Area', 'Oblast'), t('Rule', 'Pravidlo')], A11Y),
      h('h2', null, t('Keyboard: shortcut recorder', 'Klávesnice: nahrávání zkratky')), table([t('Key', 'Klávesa'), t('Behaviour', 'Chování')], KB),
      h('h2', null, t('Czech and long labels', 'Čeština a dlouhé popisky')),
      h('ul', null, h('li', null, t('No fixed label widths. Label column flex-basis 250 px; the control wraps below it rather than truncating.', 'Žádné pevné šířky popisků. Sloupec popisku má flex-basis 250 px; prvek se raději zalomí pod něj, než aby se usekl.')), h('li', null, t('Buttons and segments hug their text; segmented options never ellipsize. Rail items wrap to two lines if needed (“Přístup a oznámení” fits in 216 px).', 'Tlačítka a segmenty se přizpůsobí textu; segmenty se nikdy nezkracují. Položky lišty se v nouzi zalomí na dva řádky („Přístup a oznámení“ se do 216 px vejde).')), h('li', null, t('Numbers and times follow the interface language (62 % / 12. 11.); key caps use symbols in both, with spelled-out names for screen readers.', 'Čísla a časy se řídí jazykem rozhraní (62 % / 12. 11.); klávesy používají symboly v obou jazycích a pro čtečky vypsané názvy.'))));
  }

  renderVals() {
    const v = this.view(), t = this.t;
    const VL = [['general', t('General', 'Obecné')], ['access', t('Access', 'Přístup')], ['engines', t('AI engines', 'AI enginy')], ['runtime', 'Runtime'], ['status', t('Status', 'Stav')], ['narrow', t('Narrow 1100', 'Úzký 1100')], ['phone', t('Phone 390', 'Telefon 390')], ['entry', t('Entry points', 'Vstupní body')], ['grammar', t('Grammar & states', 'Gramatika a stavy')], ['map', t('Map & a11y', 'Mapa a přístupnost')]];
    let page;
    if (['general', 'access', 'engines', 'runtime', 'status'].indexOf(v) >= 0) page = this.vPage(v);
    else if (v === 'narrow') page = this.vNarrow();
    else if (v === 'phone') page = this.vPhone();
    else if (v === 'entry') page = this.vEntry();
    else if (v === 'grammar') page = this.vGrammar();
    else page = this.vMap();
    const S = this.state;
    return {
      views: VL.map(([k, l]) => ({ label: l, on: v === k, pick: () => this.setState({ view: k }) })),
      scens: [['first', t('First run', 'První spuštění')], ['set', t('Configured', 'Nastaveno')]].map(([k, l]) => ({ label: l, on: (k === 'first') === !S.token, pick: () => this.setState(k === 'first' ? { token: false, slack: false, bc: false, oa: false, hl: null } : { token: true, slack: true, bc: true, oa: true, hl: null }) })),
      langs: [['en', 'EN'], ['cs', 'CS']].map(([k, l]) => ({ label: l, on: this.lang() === k, pick: () => this.setState({ lang: k }) })),
      themes: [['dark', t('Dark', 'Tmavé')], ['light', t('Light', 'Světlé')]].map(([k, l]) => ({ label: l, on: this.theme() === k, pick: () => this.setTheme(k) })),
      theme: this.theme(), page
    };
  }
}
