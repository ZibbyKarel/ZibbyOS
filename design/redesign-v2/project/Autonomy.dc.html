<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIBBY — režimy a úrovně autonomie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<link rel="stylesheet" href="./orb.css">
<script src="./orb.js"></script>
<style>
.au-wrap{width:1440px;max-width:calc(100% - 40px);margin:0 auto}
.au-intro{padding:30px 0 4px}
.au-intro h2{font-size:26px;font-weight:500;letter-spacing:-.03em;margin:0 0 6px}
.au-intro p{color:var(--ink2);font-size:14px;max-width:880px;margin:0 0 8px;text-wrap:pretty}
.au-intro p b{color:var(--ink);font-weight:500}
.au-stage{position:relative;margin:14px auto 56px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.au-stage.glow::after,.ph.glow::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:70;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--amber) 75%,transparent),inset 0 0 46px color-mix(in srgb,var(--amber) 22%,transparent);animation:auglow 3.2s ease-in-out infinite}
.au-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.au-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:-34px auto 56px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.au-notes b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.au-sim{display:flex;align-items:center;gap:8px;margin:10px auto 0;font-size:12px;color:var(--ink3)}
.au-sim .fchips{padding:0}
/* header (Top Chrome) */
.tc-h{position:relative;z-index:40;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;background:var(--p1);border-bottom:1px solid var(--line);transition:border-color .2s}
.tc-h.auto{border-bottom-color:color-mix(in srgb,var(--amber) 55%,transparent)}
.tc-brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;border-radius:8px;padding:4px 4px 4px 2px;flex:none}
.tc-wm{font-weight:600;letter-spacing:-.03em;font-size:14.5px}
.tc-sec{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
.tc-sec a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 8px;border-radius:7px;color:var(--ink3);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.tc-sec a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tc-sec a[aria-current=page]{color:var(--ink);background:var(--p3);box-shadow:0 0 0 1px var(--line2)}
.bz[data-theme=light] .tc-sec a[aria-current=page]{background:var(--p1);box-shadow:0 1px 2px rgba(20,22,26,.08),0 0 0 1px var(--line2)}
.tc-sec a:focus-visible,.tc-brand:focus-visible,.tc-lk:focus-visible,.zm-link:focus-visible,.au-band:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tc-sp{flex:1;min-width:8px}
.tc-div{width:1px;height:22px;background:var(--line2);flex:none;margin:0 4px}
.tc-cmd{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:12.5px;white-space:nowrap}
.tc-new{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.tc-new.io{width:32px;height:32px;padding:0;justify-content:center}
.tc-stat{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.tc-stat .n{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink)}
.tc-eng{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-family:'Geist Mono',monospace;font-size:9px;font-weight:600;background:var(--p3);color:var(--ink);border:1px solid var(--line2);flex:none}
.tc-ib{position:relative;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
.bz .tc-ib{text-align:center}
.tc-ib:hover{background:var(--p2);color:var(--ink)}
.tc-bell b{position:absolute;top:2px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:9.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--p1)}
.tc-bell b.amb{background:var(--amber);color:var(--on-amber)}
.tc-node{transform-box:fill-box;transform-origin:center;animation:tcpulse 1.3s ease-in-out infinite}
.tc-anc{position:relative;display:inline-flex}
.tc-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:45;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;font-size:12.5px;color:var(--ink);white-space:normal}
.tc-pop.l{left:0;right:auto}
.tc-ph{padding:8px 8px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tc-lk{color:var(--ink2);font-size:12px;text-decoration:none;border-radius:5px;padding:2px 4px;white-space:nowrap}
.tc-lk:hover{color:var(--ink)}
.tc-catch{position:absolute;inset:0;z-index:30}
.tc-ctx{position:relative;z-index:10;display:flex;align-items:stretch;height:42px;padding:0 14px;border-bottom:1px solid var(--line);gap:4px}
.tc-tabs{display:flex;align-items:stretch;gap:2px}
.tc-tabs a{position:relative;display:inline-flex;align-items:center;padding:0 10px;color:var(--ink3);font-size:13px;text-decoration:none;white-space:nowrap}
.tc-tabs a[aria-current=page]{color:var(--ink);font-weight:500}
.tc-tabs a[aria-current=page]::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--ink)}
.tc-page{padding:22px 24px 28px;display:flex;flex-direction:column;gap:14px}
.tc-sk{height:10px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tc-card{border:1px solid var(--line);border-radius:10px;background:var(--p1);padding:14px;display:flex;flex-direction:column;gap:9px}
.tc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tc-mbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 6px;background:var(--p1);border-bottom:1px solid var(--line);position:relative;z-index:5}
.tc-mbar .tc-brand{padding:4px}
.tc-mtitle{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
/* ===== Zibby section: orb + mode selector, tinted by mode ===== */
.zs{display:inline-flex;align-items:stretch;height:32px;border-radius:999px;border:1px solid var(--line2);transition:background .2s,border-color .2s,box-shadow .2s}
.zs>button,.zs .tc-anc>button{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap;color:inherit}
.zs .zb{padding:0 10px 0 6px;border-radius:999px 0 0 999px}
.zs .zm{height:100%;padding:0 9px 0 10px;gap:6px;border-left:1px solid currentColor;border-left-color:color-mix(in srgb,currentColor 30%,transparent);border-radius:0 999px 999px 0}
.zs .zb:hover,.zs .zm:hover,.zs .zm[aria-expanded=true]{background:color-mix(in srgb,currentColor 10%,transparent)}
.zs.manual{color:var(--ink3);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.zs.semi{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 55%,transparent);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.zs.auto{color:var(--amber-fg);border-color:color-mix(in srgb,var(--amber) 70%,transparent);background:color-mix(in srgb,var(--amber) 15%,transparent);animation:zsglow 2.4s ease-in-out infinite}
.zs.compact .zb{padding:0 4px 0 5px}
.zs.compact .zm{padding:0 8px}
.zs .orb{margin:0 1px}
.zg{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.zg.manual{background:transparent;border:1.5px solid currentColor}
.zg.semi{background:linear-gradient(90deg,currentColor 50%,transparent 50%);border:1.5px solid currentColor}
/* mode menu */
.zm-head{display:flex;gap:16px;align-items:center;padding:16px 14px 14px;margin:-6px -6px 8px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.zm-head.manual{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.zm-head.semi{background:color-mix(in srgb,var(--violet) 10%,transparent)}
.zm-head.auto{background:color-mix(in srgb,var(--amber) 12%,transparent)}
.zm-head b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.zm-head b span{font-weight:400;color:var(--ink2)}
.zm-head small{display:block;color:var(--ink2);font-size:12px;line-height:1.45;margin-top:2px}
.zm-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.zm-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 6px 11px;border-radius:10px;border:1px solid var(--line2);color:var(--ink)}
.bz .zm-card{text-align:center}
.zm-card:hover{background:var(--p2)}
.zm-card b{display:block;font-size:12.5px;font-weight:600}
.zm-card small{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.zm-card[aria-checked=true].manual{border-color:var(--ink3);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.zm-card[aria-checked=true].semi{border-color:color-mix(in srgb,var(--violet) 70%,transparent);background:color-mix(in srgb,var(--violet) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--violet) 40%,transparent)}
.zm-card[aria-checked=true].semi b{color:var(--violet)}
.zm-card[aria-checked=true].auto{border-color:color-mix(in srgb,var(--amber) 75%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 40%,transparent)}
.zm-card[aria-checked=true].auto b{color:var(--amber-fg)}
.au-bs .zm-card{padding:20px 6px 14px}
.au-bs .zm-card b{font-size:14px}
.au-bs .zm-head{margin:0 0 10px;border-radius:12px;border:1px solid var(--line)}
.zm-sep{height:1px;background:var(--line);margin:6px -6px}
.zm-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none}
.zm-link:hover{background:var(--p2)}
.zm-link>span{flex:1}
.zm-link small{display:block;color:var(--ink3);font-size:11.5px}
.zm-pend{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;background:color-mix(in srgb,var(--ink) 4%,transparent);margin-bottom:4px}
.zm-pend>span{flex:1}
/* ===== levels page ===== */
.lv-main{padding:22px 24px 120px;display:flex;flex-direction:column;gap:16px}
.lv-head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.lv-head>div:first-child{flex:1;min-width:420px}
.lv-head h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.lv-head p{color:var(--ink2);font-size:13px;max-width:720px}
.lv-mode{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--p1);font-size:12.5px;color:var(--ink2)}
.lv-seg{display:inline-flex;padding:2px;border-radius:9px;border:1px solid var(--line2);background:var(--bg)}
.lv-seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink3)}
.lv-seg button:hover{color:var(--ink)}
.lv-seg button[aria-checked=true].manual{background:var(--p3);color:var(--ink)}
.lv-seg button[aria-checked=true].semi{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.lv-seg button[aria-checked=true].auto{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber-fg)}
table.lv{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;background:var(--p1);overflow:visible;font-size:12.5px}
table.lv th,table.lv td{border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
table.lv tbody tr:last-child>*{border-bottom:0}
table.lv thead th{position:sticky;top:0;z-index:6;padding:10px 12px;font-weight:500;color:var(--ink3);background:color-mix(in srgb,var(--ink) 3%,var(--p1));border-bottom-color:var(--line2);box-shadow:0 1px 0 var(--line2),0 8px 14px -12px rgba(0,0,0,.6)}
.lv-scroll{height:760px;overflow:auto;scrollbar-width:thin}
table.lv thead th:first-child{border-top-left-radius:12px}
table.lv thead th:last-child{border-top-right-radius:12px}
.lv-lh{display:flex;align-items:center;gap:8px}
.lv-lh b{font-size:13px;font-weight:600;color:var(--ink)}
.lv-lh small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.lv-lh.semi b{color:var(--violet)}
.lv-lh.auto b{color:var(--amber-fg)}
.lv-capnote{display:inline-flex;margin-top:5px;font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;color:var(--ink2);background:color-mix(in srgb,var(--ink) 7%,transparent)}
table.lv td.ln{padding:6px;border-left:1px solid var(--line);width:28%}
.lane{min-height:44px;display:flex;flex-wrap:wrap;align-content:center;gap:6px;padding:6px;border-radius:9px;border:1px dashed transparent;transition:background .12s,border-color .12s}
.lane.capped{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--ink) 3.5%,transparent) 7px 8px)}
.lane.dropok{border-color:var(--line2)}
.lane.dropok.manual{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.lane.dropok.semi{border-color:color-mix(in srgb,var(--violet) 50%,transparent);background:color-mix(in srgb,var(--violet) 6%,transparent)}
.lane.dropok.auto{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 6%,transparent)}
.lane .empty{color:var(--ink3);font-size:11.5px;padding-left:4px}
.lv-cw{position:relative;display:inline-flex}
.lv-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--line2);background:var(--p2);color:var(--ink);cursor:grab;white-space:nowrap}
.lv-chip:active{cursor:grabbing}
.lv-chip .gr{color:var(--ink3);opacity:.7;margin-right:-2px}
.lv-chip.semi{border-color:color-mix(in srgb,var(--violet) 45%,transparent);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.lv-chip.auto{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 13%,transparent)}
.lv-chip.inh{border-style:dashed;background:transparent;color:var(--ink2)}
.lv-chip .own{width:5px;height:5px;border-radius:50%;background:var(--ink);margin-left:2px}
.lv-chip[aria-expanded=true]{box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 25%,transparent)}
.lv-chip.dragging{opacity:.35}
table.lv th.nm{padding:10px 12px;width:260px;font-weight:400}
.lv-nm{display:flex;align-items:center;gap:9px;position:relative}
.lv-nm b{display:block;font-weight:500;color:var(--ink)}
.lv-nm small{display:block;color:var(--ink3);font-size:11.5px}
.lv-nm .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--ink2);flex:none}
tr.team .lv-nm{padding-left:26px}
tr.team .lv-nm::before{content:'';position:absolute;left:10px;top:-14px;width:10px;height:28px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);border-bottom-left-radius:6px}
tr.global>*{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.lv-acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.lv-acts .btn{height:22px;padding:0 7px;font-size:11.5px;gap:4px}
.lv-menu{width:232px}
.lv-mi{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:0 8px;border-radius:7px;color:var(--ink)}
.lv-mi:hover{background:var(--p2)}
.lv-mi[aria-disabled=true]{color:var(--ink3);cursor:not-allowed}
.lv-mi small{margin-left:auto;color:var(--ink3);font-size:11px}
.lv-never{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px dashed var(--line2);color:var(--ink2);font-size:12.5px}
.lv-never>b{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:500;margin-right:4px}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ink:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.btn.ink[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.au-toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 14px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:12.5px;box-shadow:var(--shadow-pop);white-space:nowrap}
.au-toast button{color:var(--on-ink);text-decoration:underline;font-weight:500}
/* confirm */
.au-scrim{position:absolute;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(2px)}
.au-dlg{position:absolute;z-index:51;top:90px;left:50%;transform:translateX(-50%);width:500px;background:var(--sheet);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden}
.au-dlg-h{display:flex;align-items:center;gap:10px;padding:16px 14px 6px 20px}
.au-dlg-h h3{flex:1;font-size:17px;font-weight:600;letter-spacing:-.015em}
.au-dlg-b{padding:4px 20px 16px;display:flex;flex-direction:column;gap:12px;color:var(--ink2);font-size:13px}
.au-dlg-b ul{margin:0;padding-left:18px}
.au-dlg-b li{margin:2px 0}
.au-dlg-b li b{color:var(--ink);font-weight:500}
.au-never{padding:12px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3%,transparent);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.au-never-h{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:500;font-size:12.5px}
.au-never-l{display:flex;flex-wrap:wrap;gap:5px}
.au-tok{display:flex;flex-direction:column;gap:6px}
.au-tok label{color:var(--ink);font-weight:500;font-size:12.5px}
.au-tok input{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font-family:'Geist Mono',monospace;font-size:12.5px}
.au-tok input:focus{outline:2px solid var(--amber);outline-offset:1px}
.au-tok small{color:var(--ink3);font-size:11.5px}
.au-tokok{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.au-tokok svg{color:var(--emerald)}
.au-dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
/* phone */
.au-phs{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin:18px auto 60px}
.au-phs>div>p{font-size:12px;color:var(--ink3);margin:0 0 10px;text-align:center}
.au-band{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12.5px;color:var(--ink2);text-decoration:none;background:color-mix(in srgb,var(--amber) 13%,transparent);border-bottom:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
.au-band b{color:var(--amber-fg);font-weight:600}
.au-band .lk{margin-left:auto;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:2px}
.au-bs-wrap{position:absolute;inset:0;z-index:60}
.au-bs-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.au-bs{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:8px 12px 30px;box-shadow:var(--shadow-pop)}
.au-grab{width:38px;height:4px;border-radius:9px;background:var(--line2);margin:2px auto 12px}
.au-bs .zm-link{min-height:50px;font-size:14px}
@keyframes tcpulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes zospin{to{transform:rotate(360deg)}}
