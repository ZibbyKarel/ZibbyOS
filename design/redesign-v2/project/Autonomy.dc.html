<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIBBY — režimy a úrovně autonomie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="./bridge.css">
<link rel="stylesheet" href="./orb.css">
<script src="./orb.js"></script>
<style>
.au-wrap{width:1440px;max-width:calc(100% - 40px);margin:0 auto}
.au-intro{padding:30px 0 4px}
.au-intro h2{font-size:26px;font-weight:500;letter-spacing:-.03em;margin:0 0 6px}
.au-intro p{color:var(--ink2);font-size:14px;max-width:880px;margin:0 0 8px;text-wrap:pretty}
.au-intro p b{color:var(--ink);font-weight:500}
.au-stage{position:relative;margin:14px auto 56px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.au-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.au-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:-34px auto 56px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.au-notes b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.au-sim{display:flex;align-items:center;gap:8px;margin:10px auto 0;font-size:12px;color:var(--ink3)}
.au-sim .fchips{padding:0}
/* header (Top Chrome) */
.tc-h{position:relative;z-index:40;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;background:var(--p1);border-bottom:1px solid var(--line);transition:border-color .2s}
.tc-brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;border-radius:8px;padding:4px 4px 4px 2px;flex:none}
.tc-wm{font-weight:600;letter-spacing:-.03em;font-size:14.5px}
.tc-sec{display:flex;gap:2px;padding:3px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,transparent);border:1px solid var(--line)}
.tc-sec a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 8px;border-radius:7px;color:var(--ink3);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.tc-sec a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tc-sec a[aria-current=page]{color:var(--ink);background:var(--p3);box-shadow:0 0 0 1px var(--line2)}
.bz[data-theme=light] .tc-sec a[aria-current=page]{background:var(--p1);box-shadow:0 1px 2px rgba(20,22,26,.08),0 0 0 1px var(--line2)}
.tc-sec a:focus-visible,.tc-brand:focus-visible,.tc-lk:focus-visible,.zm-link:focus-visible,.au-band:focus-visible,.zm-pause:focus-visible,.lv-add:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tc-sp{flex:1;min-width:8px}
.tc-div{width:1px;height:22px;background:var(--line2);flex:none;margin:0 4px}
.tc-cmd{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink3);font-size:12.5px;white-space:nowrap}
.tc-new{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.tc-stat{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.tc-stat .n{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--ink)}
.tc-eng{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-family:'Geist Mono',monospace;font-size:9px;font-weight:600;background:var(--p3);color:var(--ink);border:1px solid var(--line2);flex:none}
.tc-ib{position:relative;width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink2);flex:none}
.bz .tc-ib{text-align:center}
.tc-ib:hover{background:var(--p2);color:var(--ink)}
.tc-bell b{position:absolute;top:2px;right:0;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:9.5px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--p1)}
.tc-bell b.amb{background:var(--amber);color:var(--on-amber)}
.tc-node{transform-box:fill-box;transform-origin:center;animation:tcpulse 1.3s ease-in-out infinite}
.tc-anc{position:relative;display:inline-flex}
.tc-pop{position:absolute;top:calc(100% + 10px);right:0;z-index:45;background:var(--sheet);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;font-size:12.5px;color:var(--ink);white-space:normal}
.tc-pop.l{left:0;right:auto}
.tc-ph{padding:8px 8px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tc-lk{color:var(--ink2);font-size:12px;text-decoration:none;border-radius:5px;padding:2px 4px;white-space:nowrap}
.tc-lk:hover{color:var(--ink)}
.tc-catch{position:absolute;inset:0;z-index:30}
.tc-ctx{position:relative;z-index:10;display:flex;align-items:stretch;height:42px;padding:0 14px;border-bottom:1px solid var(--line);gap:4px}
.tc-tabs{display:flex;align-items:stretch;gap:2px}
.tc-tabs a{position:relative;display:inline-flex;align-items:center;padding:0 10px;color:var(--ink3);font-size:13px;text-decoration:none;white-space:nowrap}
.tc-tabs a[aria-current=page]{color:var(--ink);font-weight:500}
.tc-tabs a[aria-current=page]::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--ink)}
.tc-page{padding:22px 24px 28px;display:flex;flex-direction:column;gap:14px}
.tc-sk{height:10px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tc-card{border:1px solid var(--line);border-radius:10px;background:var(--p1);padding:14px;display:flex;flex-direction:column;gap:9px}
.tc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tc-mbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 6px;background:var(--p1);border-bottom:1px solid var(--line);position:relative;z-index:5}
.tc-mbar .tc-brand{padding:4px}
.tc-mtitle{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
/* ===== Zibby section: orb + run state ===== */
.zs{display:inline-flex;align-items:stretch;height:32px;border-radius:999px;border:1px solid var(--line2);transition:background .2s,border-color .2s}
.zs>button,.zs .tc-anc>button{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap;color:inherit}
.zs .zb{padding:0 10px 0 6px;border-radius:999px 0 0 999px}
.zs .zm{height:100%;padding:0 9px 0 10px;gap:6px;border-left:1px solid currentColor;border-left-color:color-mix(in srgb,currentColor 30%,transparent);border-radius:0 999px 999px 0}
.zs .zb:hover,.zs .zm:hover,.zs .zm[aria-expanded=true]{background:color-mix(in srgb,currentColor 10%,transparent)}
.zs.paused{color:var(--ink3);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.zs.run{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 55%,transparent);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.zs.compact .zb{padding:0 4px 0 5px}
.zs.compact .zm{padding:0 8px}
.zs .orb{margin:0 1px}
/* run menu */
.zm-head{display:flex;gap:16px;align-items:center;padding:16px 14px 14px;margin:-6px -6px 8px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.zm-head.paused{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.zm-head.run{background:color-mix(in srgb,var(--violet) 10%,transparent)}
.zm-head b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.zm-head b span{font-weight:400;color:var(--ink2)}
.zm-head small{display:block;color:var(--ink2);font-size:12px;line-height:1.45;margin-top:2px}
.zm-pause{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);color:var(--ink);font-size:13px;font-weight:500;text-align:left}
.zm-pause:hover{background:var(--p2)}
.zm-pause.go{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.zm-pause.go:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.zm-pause small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3);margin-top:1px}
.zm-pause.go small{color:color-mix(in srgb,var(--on-ink) 75%,transparent)}
.au-bs .zm-head{margin:0 0 10px;border-radius:12px;border:1px solid var(--line)}
.au-bs .zm-pause{min-height:56px;font-size:14px}
.zm-sep{height:1px;background:var(--line);margin:6px -6px}
.zm-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none}
.zm-link:hover{background:var(--p2)}
.zm-link>span{flex:1}
.zm-link small{display:block;color:var(--ink3);font-size:11.5px}
.zm-pend{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;background:color-mix(in srgb,var(--ink) 4%,transparent);margin-bottom:4px}
.zm-pend>span{flex:1}
/* ===== levels page ===== */
.lv-main{padding:22px 24px 120px;display:flex;flex-direction:column;gap:16px}
.lv-head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.lv-head>div:first-child{flex:1;min-width:420px}
.lv-head h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.lv-head p{color:var(--ink2);font-size:13px;max-width:720px}
.lv-mode{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--p1);font-size:12.5px;color:var(--ink2)}
.lv-mode b{color:var(--ink);font-weight:500}
.lv-pause{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:12px;border:1px solid var(--line2);background:color-mix(in srgb,var(--ink) 4%,transparent);font-size:12.5px;color:var(--ink2)}
.lv-pause b{color:var(--ink);font-weight:500}
.lv-pause .btn{margin-left:auto}
table.lv{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;background:var(--p1);overflow:visible;font-size:12.5px}
table.lv th,table.lv td{border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
table.lv tbody tr:last-child>*{border-bottom:0}
table.lv thead th{position:sticky;top:0;z-index:6;padding:10px 12px;font-weight:500;color:var(--ink3);background:color-mix(in srgb,var(--ink) 3%,var(--p1));border-bottom-color:var(--line2);box-shadow:0 1px 0 var(--line2),0 8px 14px -12px rgba(0,0,0,.6)}
.lv-scroll{height:760px;overflow:auto;scrollbar-width:thin}
table.lv thead th:first-child{border-top-left-radius:12px}
table.lv thead th:last-child{border-top-right-radius:12px}
.lv-lh{display:flex;align-items:center;gap:8px}
.lv-lh b{font-size:13px;font-weight:600;color:var(--ink)}
.lv-lh small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.lv-lh.semi b{color:var(--violet)}
.lv-lh.auto b{color:var(--amber-fg)}
table.lv td.ln{padding:6px;border-left:1px solid var(--line);width:38%}
.lane{min-height:44px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:6px;padding:6px;border-radius:9px}
.lane.capped{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--ink) 3.5%,transparent) 7px 8px)}
.lane.capped .lv-chip{opacity:.55}
.lv-cw{position:relative;display:inline-flex}
.lv-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--line2);background:transparent;color:var(--ink2);white-space:nowrap}
.lv-chip:hover{color:var(--ink);background:var(--p2)}
.lv-chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.lv-chip[aria-pressed=true]{color:var(--ink)}
.lv-chip.semi[aria-pressed=true]{border-color:color-mix(in srgb,var(--violet) 55%,transparent);background:color-mix(in srgb,var(--violet) 16%,transparent)}
.lv-chip.auto[aria-pressed=true]{border-color:color-mix(in srgb,var(--amber) 60%,transparent);background:color-mix(in srgb,var(--amber) 17%,transparent)}
.lv-chip[aria-disabled=true]{color:var(--ink3);border-style:dashed;cursor:not-allowed}
.lv-chip[aria-disabled=true]:hover{background:transparent}
.lv-chip .own{width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:2px}
table.lv th.nm{padding:10px 12px;width:260px;font-weight:400}
.lv-nm{display:flex;align-items:center;gap:9px;position:relative}
.lv-nm b{display:block;font-weight:500;color:var(--ink)}
.lv-nm small{display:block;color:var(--ink3);font-size:11.5px}
.lv-nm .lv-man{display:block;margin-top:2px;color:var(--ink2);font-size:11.5px}
.lv-nm .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--ink2);flex:none}
tr.team .lv-nm{padding-left:26px}
tr.team .lv-nm::before{content:'';position:absolute;left:10px;top:-14px;width:10px;height:28px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);border-bottom-left-radius:6px}
tr.global>*{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
.lv-acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.lv-acts .btn{height:22px;padding:0 7px;font-size:11.5px;gap:4px}
.lv-never{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;border:1px dashed var(--line2);color:var(--ink2);font-size:12.5px}
.lv-never>b{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:500;margin-right:4px}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ink:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.au-toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;padding:9px 10px 9px 14px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:12.5px;box-shadow:var(--shadow-pop);white-space:nowrap}
.au-toast button{color:var(--on-ink);text-decoration:underline;font-weight:500}
/* phone */
.au-phs{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;margin:18px auto 60px}
.au-phs>div>p{font-size:12px;color:var(--ink3);margin:0 0 10px;text-align:center}
.au-band{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12.5px;color:var(--ink2);text-decoration:none;background:color-mix(in srgb,var(--ink) 6%,transparent);border-bottom:1px solid var(--line2)}
.au-band b{color:var(--ink);font-weight:600}
.au-band .lk{margin-left:auto;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:2px}
.au-bs-wrap{position:absolute;inset:0;z-index:60}
.au-bs-scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.au-bs{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:8px 12px 30px;box-shadow:var(--shadow-pop)}
.au-grab{width:38px;height:4px;border-radius:9px;background:var(--line2);margin:2px auto 12px}
.au-bs .zm-link{min-height:50px;font-size:14px}
@keyframes tcpulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes zospin{to{transform:rotate(360deg)}}
@keyframes zobreath{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,#f5a524 55%,transparent)}50%{box-shadow:0 0 10px 2px color-mix(in srgb,#f5a524 55%,transparent)}}
</style>
</helmet>
<div class="bz" data-theme="{{ theme }}">
  <nav class="vt" aria-label="Pohledy">
    <span class="lbl">ZIBBY · autonomie</span>
    <sc-for list="{{ views }}" as="v" hint-placeholder-count="4">
      <button class="vtb" aria-pressed="{{ v.on }}" onClick="{{ v.pick }}">{{ v.label }}</button>
    </sc-for>
    <span style="flex:1"></span>
    <div class="seg" role="group" aria-label="Téma">
      <sc-for list="{{ themes }}" as="t" hint-placeholder-count="2">
        <button aria-pressed="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button>
      </sc-for>
    </div>
  </nav>
  {{ page }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"],"tsType":"string","section":"View"},"view":{"editor":"enum","default":"header","options":["header","levels","phone","notes"],"tsType":"string","section":"View"}}'>
class Component extends DCLogic {
  state = { view: null, theme: null, paused: false, own: null, open: null, menu: null, toast: null, undo: null, exp: { acme: true, north: true, contoso: true }, sim: { pending: true } };
  h = (t, p, ...c) => React.createElement(t, p, ...c.flat(Infinity));
  pd = e => { if (e && e.preventDefault) e.preventDefault(); };
  theme() { if (this.state.theme) return this.state.theme; let t = null; try { t = localStorage.getItem('bridge-theme'); } catch (e) {} return t || this.props.theme || 'dark'; }
  setTheme = t => { try { localStorage.setItem('bridge-theme', t); } catch (e) {} this.setState({ theme: t }); };
  view() { return this.state.view || this.props.view || 'header'; }

  // ===== data =====
  // Jedna hodnota na schopnost a scope: manual | semi | auto.
  // UI ji ukazuje jako dva sčítané sloupce: Poloautomat = semi|auto, Automat = auto.
  COLS = ['semi', 'auto'];
  M = {
    manual: { label: 'Ručně', short: 'ručně' },
    semi: { label: 'Poloautomat', short: 'jen Poloautomat', lane: 'Připraví, čeká na schválení' },
    auto: { label: 'Automat', short: 'Poloautomat + Automat', lane: 'Připraví a sám odešle' }
  };
  RUN = {
    run: { label: 'Běží', sl: 'Přemýšlí', desc: 'Dělá to, co mu povolují Úrovně autonomie.' },
    paused: { label: 'Pozastaveno', sl: 'Spí', desc: 'Nic nového nezačne a nic neodešle, dokud ho nepustíš.' }
  };
  SCOPES = [
    { id: 'global', label: 'Výchozí', sub: 'Pro vše bez výjimky', kind: 'global', parent: null },
    { id: 'acme', label: 'Acme Corp', sub: 'Firma', kind: 'company', parent: 'global' },
    { id: 'acme-plat', label: 'Platform', sub: 'Tým · Acme Corp', kind: 'team', parent: 'acme' },
    { id: 'acme-growth', label: 'Growth', sub: 'Tým · Acme Corp', kind: 'team', parent: 'acme' },
    { id: 'north', label: 'Northwind', sub: 'Firma', kind: 'company', parent: 'global' },
    { id: 'north-data', label: 'Data', sub: 'Tým · Northwind', kind: 'team', parent: 'north' },
    { id: 'contoso', label: 'Contoso', sub: 'Firma', kind: 'company', parent: 'global' },
    { id: 'contoso-mob', label: 'Mobile', sub: 'Tým · Contoso', kind: 'team', parent: 'contoso' },
    { id: 'contoso-web', label: 'Web', sub: 'Tým · Contoso', kind: 'team', parent: 'contoso' },
    { id: 'initech', label: 'Initech', sub: 'Firma', kind: 'company', parent: 'global' },
    { id: 'personal', label: 'Osobní', sub: 'Firma', kind: 'company', parent: 'global' }
  ];
  CAPS = [
    { id: 'review', name: 'Code review', icon: 'pr' },
    { id: 'comments', name: 'Připomínky z review', icon: 'msg' },
    { id: 'implement', name: 'Implementace', icon: 'work' },
    { id: 'communicate', name: 'Komunikace', icon: 'chat' },
    { id: 'ci', name: 'Oprava CI', icon: 'ci' }
  ];
  INIT = {
    global: { review: 'auto', comments: 'auto', implement: 'semi', communicate: 'auto', ci: 'auto' },
    acme: { communicate: 'semi' },
    'acme-growth': { ci: 'manual' },
    north: { comments: 'semi', communicate: 'manual' },
    'contoso-mob': { review: 'semi', comments: 'semi' },
    initech: { review: 'manual', comments: 'manual', implement: 'manual', communicate: 'manual', ci: 'manual' }
  };
  NEVER = ['Merge', 'Deploy', 'Platby', 'Mazání', 'Force push', 'Push do sdílených větví', 'E-mail', 'Nová issue v Jiře'];
  SECS = [['dash', 'Dashboard', 'dash'], ['work', 'Práce', 'work'], ['port', 'Portfolio', 'comp'], ['wf', 'Workforce', 'team'], ['know', 'Znalosti', 'know'], ['gov', 'Governance', 'gov']];

    const stat = (p, open) => h('div', { className: 'au-stage', style: { width: 1440, height: open ? 520 : 230, marginBottom: 8 } }, this.hdr({ paused: p, open, pending: true, own: this.INIT }), this.pageStub());
    const cap = (t, d) => h('div', { className: 'cap' }, h('b', null, t), h('span', null, d));
    return h('div', { className: 'au-wrap' },
      h('div', { className: 'au-intro' }, h('h2', null, 'Hlavička: Zibby a vypínač'),
        h('p', null, 'Sekce Zibbyho v hlavičce má dvě části: ', h('b', null, 'orb'), ' otevře konverzaci (⌘J) a ', h('b', null, 'stav'), ' ukazuje, jestli Zibby běží. Režim už v hlavičce není: co Zibby smí, říkají jen Úrovně autonomie. Zůstal vypínač ', h('b', null, 'Pozastavit'), ' jako nouzová brzda, která jedním klikem zastaví všechno bez ohledu na tabulku.'),
        h('p', null, 'Běží = Přemýšlí (fialový vír), Pozastaveno = Spí (šedý, skoro nehybný). Pozastavení i puštění je okamžité, bez potvrzení a bez tokenu.')),
      h('div', { className: 'au-sim', style: { width: 1440, maxWidth: 'calc(100% - 40px)' } }, 'Simulace', h('div', { className: 'fchips' },
        h('button', { 'aria-pressed': !!S.sim.pending, onClick: () => this.setState({ sim: Object.assign({}, S.sim, { pending: !S.sim.pending }) }) }, 'Čekající schválení'))),
      h('div', { className: 'au-stage', style: { width: 1440, height: 520 } }, this.hdr(live), this.pageStub(), this.overlays()),
      cap('Běží', 'Zibby přemýšlí: fialová síť se kroutí do víru. Dělá to, co mu povolují Úrovně autonomie.'),
      stat(false),
      cap('Pozastaveno', 'Zibby spí: šedá síť, skoro bez pohybu. Nic nového nezačne a nic neodešle, rozdělaná práce počká.'),
      stat(true),
      cap('Nabídka', 'Nahoře orb ve stavu a jedna věta, co stav znamená. Pod tím velké tlačítko Pozastavit / Pustit, čekající schválení a odkaz na Úrovně autonomie s výčtem výjimek.'),
      stat(false, true), stat(true, true),
      h('div', { className: 'au-notes', style: { width: 1440, maxWidth: 'calc(100% - 40px)' } },
        h('div', null, h('b', null, 'Ovládání'), 'Skupina role=group „Zibby“: tlačítko konverzace a tlačítko stavu (aria-haspopup, aria-label „Zibby: Běží. Změnit“). Stav nikdy nenese jen barva: text Běží / Pozastaveno je vždy vidět.'),
        h('div', null, h('b', null, 'Úzká hlavička'), 'Při kolapsu (Top Chrome, krok 4+) zmizí text „Zibby“, stav zůstane. Na 1024 px zůstane jen orb a stav.'),
        h('div', null, h('b', null, 'Co mizí'), 'Přepínač tří režimů, strop nad tabulkou, potvrzení s operátorským tokenem a amber záře Automatu. Amber zůstává jen pro „čeká na tebe“.')));
  }

  phoneTop(paused, pending) {
    const h = this.h;
    return h('header', { className: 'tc-mbar' },
      h('button', { className: 'tc-ib', 'aria-label': 'Menu' }, this.ic('menu', 19)),
      h('a', { href: '#', className: 'tc-brand', 'aria-label': 'ZibbyOS', onClick: this.pd }, this.mark(20)),
      h('span', { className: 'tc-mtitle' }, 'Dashboard'), h('span', { style: { flex: 1 } }),
      this.zsec({ paused, compact: true }),
      h('button', { className: 'tc-ib tc-bell', 'aria-label': 'Oznámení, 5 nepřečtených' }, this.ic('bell', 18), h('b', { className: pending ? 'amb' : null, 'aria-hidden': 'true' }, '5')));
  }
  phoneFrame(kids) { const h = this.h; return h('div', { className: 'stage phone', style: { margin: 0 } }, h('div', { className: 'ph' }, h('div', { className: 'sbar', 'aria-hidden': 'true' }, h('span', null, '9:41'), h('span', { style: { fontSize: 12 } }, '5G ▮▮▮')), kids)); }
  phoneBody(paused) {
    const h = this.h;
    return [this.phoneTop(paused, true),
      paused ? h('a', { href: '#', key: 'b', className: 'au-band', onClick: this.pd }, this.ic('pause', 14, 2), h('span', null, h('b', null, 'Pozastaveno'), ' · nic neběží'), h('span', { className: 'lk' }, 'Pustit', this.ic('chevr', 14))) : null,
      h('main', { className: 'tc-page', key: 'm', style: { padding: 16 } }, [0, 1, 2].map(i => h('div', { className: 'tc-card', key: i }, h('div', { className: 'tc-sk', style: { width: '44%' } }), h('div', { className: 'tc-sk', style: { width: '82%', opacity: .6 } }))))];
  }
  phonePage() {
    const h = this.h, col = (l, el, k) => h('div', { key: k }, h('p', null, l), el);
    const sheet = [this.phoneBody(false), h('div', { className: 'au-bs-wrap', key: 'bs' }, h('div', { className: 'au-bs-scrim', 'aria-hidden': 'true' }),
      h('div', { className: 'au-bs', role: 'dialog', 'aria-label': 'Stav Zibbyho' }, h('div', { className: 'au-grab', 'aria-hidden': 'true' }),
        this.runHead('run'), this.pauseBtn({ paused: false }), h('div', { className: 'zm-sep' }),
        h('a', { href: '#', className: 'zm-pend', onClick: this.pd }, h('span', { className: 'dot blocked' }), h('span', null, '3 schválení čekají na tebe'), this.ic('chevr', 14)),
        this.levelsLink({ own: this.INIT })))];
    return h('div', { className: 'au-wrap' },
      h('div', { className: 'au-intro' }, h('h2', null, 'Telefon · 390'),
        h('p', null, 'V toolbaru zůstane kompaktní sekce Zibbyho: orb a stav (Běží / Pozastaveno). Klepnutí na orb otevře konverzaci, na stav sheet s vypínačem a odkazem na Úrovně autonomie. Když je Zibby pozastavený, ukáže se navíc šedý pásek, protože malou sekci je snadné přehlédnout.')),
      h('div', { className: 'au-phs' },
        col('Běží', this.phoneFrame(this.phoneBody(false)), 'a'),
        col('Pozastaveno', this.phoneFrame(this.phoneBody(true)), 'b'),
        col('Nabídka', this.phoneFrame(sheet), 'c')));
  }

  notesPage() {
    const h = this.h, c = t => h('code', null, t);
    const res = [
      ['ne', 'ne', 'nic, řešíš ručně', 'nic'],
      ['ano', 'ne', 'připraví, čeká na tvé schválení', 'nic'],
      ['ano', 'ano', 'připraví, sám schválí a odešle, pošle report', 'nic'],
      ['ne', 'ano', 'nejde: zapnutí Automatu zapne i Poloautomat', '—']
    ];
    return h('div', { className: 'spec' },
      h('h1', null, 'Model a pravidla'),
      h('p', { className: 'lede' }, 'Dvě místa, dvě různé věci: ', h('strong', null, 'Úrovně autonomie říkají, co Zibby smí'), ' (po schopnostech, firmách a týmech), ', h('strong', null, 'vypínač v hlavičce říká, jestli vůbec běží'), '. Poloautomat a Automat jsou oprávnění, která se sčítají, ne tři exkluzivní úrovně. Orb v hlavičce používá stavy ze stránky Zibby: Běží = think, Pozastaveno = sleep (', c('<ZibbyOrb state />'), ').'),
      h('h2', null, 'Co se stane'),
      h('table', null, h('thead', null, h('tr', null, ['Poloautomat', 'Automat', 'Zibby běží', 'Zibby pozastavený'].map(t => h('th', { key: t }, t)))),
        h('tbody', null, res.map((r, i) => h('tr', { key: i }, r.map((t, j) => h('td', { key: j }, t)))))),
      h('h2', null, 'Změna dat (navrhuji)'),
      h('pre', null, 'paused: boolean                                            // místo level off | full\nautomation[scope][capability]: "manual" | "semi" | "auto"   // dnes boolean\n\nUI: Poloautomat zaškrtnutý = semi | auto, Automat zaškrtnutý = auto\npaused → nic nestartuje ani neodesílá · jinak platí buňka'),
      h('p', null, 'Jedna hodnota na buňku místo dvou booleanů drží pravidlo „Automat jen s Poloautomatem“ přímo v datech: neplatný stav nejde uložit.'),
      h('table', null, h('thead', null, h('tr', null, h('th', null, 'Téma'), h('th', null, 'Návrh'))), h('tbody', null, [
        ['Migrace', 'Toggle false → manual. Toggle true → auto, pokud byl level full, jinak semi (dnešní off znamená „pracuje a čeká“). paused = false. Chování se nezmění.'],
        ['Pozastavení', 'Bez tokenu a bez potvrzení, oběma směry, i z chatu (autopilot_off → paused = true). Rozdělaná práce počká, čekající schválení zůstanou.'],
        ['Implementace', '"auto" je povolené jako u ostatních schopností. V Automatu otevře PR sám. Kroky ze seznamu „vždy se zeptá“ (merge, push do sdílených větví) se ptají dál, řídí je Gates, ne tabulka.'],
        ['Výchozí řádek', 'Editovatelný (dnes ho UI vždy uloží vypnutý).'],
        ['Rozlišení scope', 'Beze změny: tým > firma > výchozí pro PR, firma > výchozí pro roadmapu a kanály, výchozí pro tvoje tasky.'],
        ['Routa', c('/governance/autonomy') + ' (záložka „Úrovně autonomie“ vedle Gates).']
      ].map((r, i) => h('tr', { key: i }, h('td', null, r[0]), h('td', null, r[1]))))),
      h('h2', null, 'Amber'),
      h('p', null, 'Amber se vrací jen k „čeká na tebe“ (zvonek, počítadlo Inboxu, čekající schválení). Automat ho má už jen jako barvu sloupce v tabulce, v hlavičce ani jako záři ne. Tím odpadá střet barev z předchozí verze.'),
      h('h2', null, 'Přístupnost'),
      h('ul', null,
        h('li', null, 'Každý čip je ', c('button'), ' s ', c('aria-pressed'), ', buňka je ', c('role=group'), ' s názvem („Automat · Acme Corp“). Zapnuto nenese jen barva: zapnutý čip má ✓, vypnutý +.'),
        h('li', null, 'Výjimka proti rodiči: tečka v čipu a v ', c('aria-label'), ' „výjimka proti Acme Corp“. Tabulka má ', c('caption'), ' a hlavičky sloupců i řádků.'),
        h('li', null, 'Stav Zibbyho má vždy text, ne jen barvu orbu. ', c('prefers-reduced-motion'), ' zastaví orb (orb.js).')));
  }

  renderVals() {
    const v = this.view();
    const VL = [['header', 'Hlavička a vypínač'], ['levels', 'Úrovně autonomie'], ['phone', 'Telefon'], ['notes', 'Model a pravidla']];
    const pages = { header: () => this.headerPage(), levels: () => this.levelsPage(), phone: () => this.phonePage(), notes: () => this.notesPage() };
    return {
      views: VL.map(([k, l]) => ({ label: l, on: v === k, pick: () => this.setState({ view: k, open: null, menu: null, toast: null, undo: null }) })),
      themes: [['dark', 'Tmavé'], ['light', 'Světlé']].map(([k, l]) => ({ label: l, on: this.theme() === k, pick: () => this.setTheme(k) })),
      theme: this.theme(),
      page: (pages[v] || pages.header)()
    };
  }
}
</script>
